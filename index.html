<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rannaghar Weekly Menu</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b4532a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone app shell. Fixed header, scrolling day cards, bottom tab bar. */
:root{
  --bg:#f6ece0; --card:#fffaf2; --ink:#2b2118; --muted:#7a6a5a; --line:#e4d5c1;
  --accent:#b4532a; --accent-ink:#fff8f0; --soft:#f0e0cc;
  --veg:#3f7d4e; --veg-bg:#e2efdf; --cn:#8a5a12; --cn-bg:#f6e6c4;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1d1712; --card:#28201a; --ink:#f3e8da; --muted:#b3a290; --line:#3d3229;
    --accent:#e08a5c; --accent-ink:#22150d; --soft:#342a22;
    --veg:#8fcf9d; --veg-bg:#22362a; --cn:#e6c27a; --cn-bg:#3a2f18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1d1712; --card:#28201a; --ink:#f3e8da; --muted:#b3a290; --line:#3d3229;
  --accent:#e08a5c; --accent-ink:#22150d; --soft:#342a22;
  --veg:#8fcf9d; --veg-bg:#22362a; --cn:#e6c27a; --cn-bg:#3a2f18;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{padding:14px 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.sync{color:var(--muted);font-size:11px;text-align:right;white-space:nowrap}
main>*{flex-shrink:0}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;border:0;padding:11px 0 12px;font-weight:600;font-size:11.5px;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card.today{border-color:var(--accent)}
.card.ok{border-color:var(--veg);border-width:2px}
.status{border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13.5px;background:var(--soft)}
.status.err{background:#f9dcd2;color:#7a2410}
.mealhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar i.over{background:#b3261e}
.tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);background:none;margin-right:8px;vertical-align:-5px;font-size:13px;font-weight:800;line-height:1;padding:0;color:var(--accent-ink)}
.tick[aria-pressed="true"]{background:var(--veg);border-color:var(--veg)}
.mini{background:none;border:0;color:var(--accent);font-weight:700;font-size:12.5px;padding:4px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.veg{background:var(--veg-bg);color:var(--veg)}
.pill.cn{background:var(--cn-bg);color:var(--cn)}
.pill.tag{background:var(--soft);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;text-align:left}
.chip.add{background:none;border-style:dashed;color:var(--muted);padding:6px 11px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 10px;font-size:12px}
.btn.plain{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tog{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
details summary{cursor:pointer;font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700}
.stepper b{font-variant-numeric:tabular-nums;min-width:20px;text-align:center}
.dish{padding:8px 0;border-top:1px solid var(--line)}
.dish:first-of-type{border-top:0}
.dish b{font-weight:600}
.note{color:var(--muted);font-size:13.5px;margin-top:2px}
.use{font-size:12.5px;color:var(--muted);margin-top:2px;font-style:italic}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex:none}
.item label{flex:1;display:flex;justify-content:space-between;gap:10px}
.item .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item .d{display:block;font-size:12px;color:var(--muted)}
.item.done label{text-decoration:line-through;color:var(--muted)}
.lib{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lib:first-of-type{border-top:0}
.lib .nm{background:none;border:0;padding:0;text-align:left;flex:1}
.lib.off .nm{color:var(--muted);text-decoration:line-through}
.hint{font-size:12.5px;color:var(--muted)}
#sheet{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#sheet[hidden]{display:none}
#toast{position:fixed;left:16px;right:16px;bottom:70px;z-index:20;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;max-width:608px;margin:0 auto}
#toast[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,6,.5)}
.sheet-body{position:relative;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px 22px;max-height:86%;overflow-y:auto;max-width:640px;width:100%;margin:0 auto}
.pick{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.ing{display:grid;grid-template-columns:1fr 62px 74px 88px;gap:5px;margin-top:5px}
.ing input,.ing select{padding:7px 6px;font-size:13px}
@media (max-width:380px){.ing{grid-template-columns:1fr 54px 66px 80px}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tog{transition:background .15s}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Rannaghar</h1><div class="sub" id="weekLabel"></div></div>
    <div class="sync" id="sync">Saved on this phone</div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="week">Menu</button>
    <button data-tab="cook">Cook</button>
    <button data-tab="shop">Shop</button>
    <button data-tab="ideas">Ideas</button>
    <button data-tab="dishes">Dishes</button>
    <button data-tab="me">Calories</button>
    <button data-tab="settings">Settings</button>
  </nav>
</div>
<div id="toast" role="status" hidden></div>
<div id="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-body" id="sheetBody"></div></div>

<script>

   where: F fish and meat, E eggs, V vegetables (all bazaar); G grocery (online); P pantry, check stock */

["bf5","Vegetable sandwich with boiled egg","bf",0,"Brown bread:1pack:G;Cucumber:1pc:V;Tomato:2pc:V;Eggs:4pc:E;Butter:30g:G","Toast the bread dry. Thin layer of butter only. One boiled egg per person on the side."],

["bf8","Doi chire with banana","bf",1,"Chire (poha):250g:G;Curd:400g:G;Banana:4pc:V","No cooking. Wash chire, soften for 5 minutes, mix with curd and banana. Sugar only if asked."],

["bf11","Alu paratha, dry roasted, with curd","bf",1,"Atta:300g:G;Potato:4pc:V;Curd:200g:G","Roast the parathas dry on the tawa and brush a little ghee only at the end."],

["d1","Musur dal","dal",1,"Masoor dal:150g:G;Onion:1pc:V;Tomato:1pc:V;Panch phoron::P","Boil the dal first. Temper with 1 tsp mustard oil, panch phoron and dry chilli."],

["f10","Tangra jhal with onion","fish",0,"Tangra fish:500g:F;Onion:1pc:V;Tomato:1pc:V","Light fry only. Thin spicy gravy with sliced onion and green chilli."],

function mealsOf(d){

  if(d.meal==="l")return ["l"];

const MI={b:0,l:1,d:2}, MK=["b","l","d"], MEALLOW={b:"breakfast",l:"lunch",d:"dinner"};
/* A cook visit covers every meal from that visit until the next one. */
function visits(){
  const eve=S.cookTime!=="morn", tname=eve?"evening":"morning";
  const starts=[];
  for(let i=0;i<7;i++)if(S.cookDays.includes(dateOf(i).getDay()))starts.push({i,at:i*3+(eve?2:0)});
  const slotsOf=(a,b)=>{const r=[];for(let x=a;x<b;x++)r.push([Math.floor(x/3),MK[x%3]]);return r;};
  const out=[];const first=starts.length?starts[0].at:21;
  if(first>0){
    let lab="Whole week (no cook days set)",sh="this week";
    if(S.cookDays.length){for(let k=1;k<=7;k++){const d=addDays(fromIso(S.weekStart),-k);if(S.cookDays.includes(d.getDay())){lab=DAY[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+tname+" visit (week before)";sh=DAY[d.getDay()]+" "+(eve?"eve":"morn")+" before";break;}}}
    out.push({id:"pre",day:-1,label:lab,short:sh,slots:slotsOf(0,first)});
  }
  starts.forEach((st,n)=>{const end=n+1<starts.length?starts[n+1].at:21;
    out.push({id:"v"+st.i+(eve?"e":"m"),day:st.i,label:label(st.i)+" "+tname+" visit",short:DAY[dateOf(st.i).getDay()]+" "+(eve?"eve":"morn"),slots:slotsOf(st.at,end)});});
  return out;
}

function okSlots(v){return v.slots.filter(([i,m])=>slotOk(i,m)&&S.plan[i][m].length);}
function dayOk(i){const ms=MK.filter(m=>S.plan[i][m].length);return ms.length>0&&ms.every(m=>slotOk(i,m));}

function applyRepeats(){(S.rep||[]).forEach(r=>{if(!dish(r.id))return;for(let i=0;i<7;i++)if(!S.plan[i][r.m].includes(r.id))S.plan[i][r.m].push(r.id);});}
function isRep(id,m){return (S.rep||[]).some(r=>r.id===id&&r.m===m);}

  const v=visitById(id);if(!v)return;
  const mine=new Set(v.slots.map(([i,m])=>i+m));
  const used=new Set();S.plan.forEach((d,j)=>MK.forEach(m=>{if(!mine.has(j+m))d[m].forEach(x=>used.add(x));}));
  const days=[...new Set(v.slots.map(([i])=>i))];
  days.forEach(i=>{

    const nd=genDay(i,used,lt,dt);MK.forEach(m=>{if(mine.has(i+m))S.plan[i][m]=nd[m].concat((S.rep||[]).filter(r=>r.m===m&&dish(r.id)&&!nd[m].includes(r.id)).map(r=>r.id));});

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function pick(type,vegOnly,used){
  const NOAUTO=["s35","s36","s40"]; // raita, salad, chutney: add by hand
  let pool=allDishes().filter(d=>d.type===type&&!NOAUTO.includes(d.id)&&!S.off.includes(d.id)&&(!vegOnly||d.veg));
  if(!pool.length)pool=allDishes().filter(d=>d.type===type&&(!vegOnly||d.veg));
  if(!pool.length)return null;
  const L=activeList();
  if(L){const inL=pool.filter(d=>L.ids.includes(d.id));if(inL.length)pool=inL;}
  const fresh=pool.filter(d=>!used.has(d.id));
  const pref=fresh.filter(d=>!S.last.includes(d.id));
  const from=pref.length?pref:(fresh.length?fresh:pool);
  const d=from[Math.floor(Math.random()*from.length)];
  used.add(d.id);return d.id;
}
function allLists(){return READY.concat(S.lists||[]);}
function listById(id){return allLists().find(l=>l.id===id)||null;}
function activeList(){return S.activeList?listById(S.activeList):null;}
function listHas(type,veg){const L=activeList();return !L||L.ids.some(id=>{const d=dish(id);return d&&d.type===type&&(!veg||d.veg);});}
function listShare(type){const L=activeList();if(!L)return 0;const ps=L.ids.map(dish).filter(d=>d&&["fish","chicken","egg","mutton"].includes(d.type));return ps.length?ps.filter(d=>d.type===type).length/ps.length:0;}
function protein(pref){
  if(listHas(pref))return pref;
  const opts=["fish","chicken","egg","mutton"].filter(t=>listHas(t));
  return opts.length?opts[Math.floor(Math.random()*opts.length)]:pref;
}
function genDay(i,used,lt,dt){
  const wd=dateOf(i).getDay(), cn=S.cnDays.includes(wd);
  const veg=S.vegDays.includes(wd)||(!!activeList()&&listHas("vegmain")&&!["fish","chicken","egg","mutton"].some(t=>listHas(t)));
  const day={b:[],l:[],d:[]};
  const push=(arr,id)=>{if(id)arr.push(id);};
  push(day.b,pick("bf",veg,used));
  let lType=veg?"vegmain":protein(wd===0?(Math.random()<.6?"mutton":"chicken"):lt);
  const vn=Math.min(2,Math.max(1,S.vegN||1));
  day.l.push("st1");push(day.l,pick("dal",true,used));for(let k=0;k<vn;k++)push(day.l,pick("side",true,used));push(day.l,pick(lType,veg,used));
  if(cn){push(day.d,pick("cncarb",veg,used));push(day.d,pick("cnmain",veg,used));if(vn>1&&!veg)push(day.d,pick("cnmain",true,used));}
  else{
    let dType=veg?"vegmain":protein(dt);
    if(!veg&&dType===lType&&listShare(lType)<0.6){const o=["chicken","egg","fish","mutton"].filter(t=>t!==lType&&listHas(t));if(o.length)dType=o[Math.floor(Math.random()*o.length)];}
    day.d.push("st2");for(let k=0;k<vn;k++)push(day.d,pick("side",true,used));push(day.d,pick(dType,veg,used));
  }
  return day;
}
function genWeek(){
  const used=new Set();
  let lb=shuffle(["fish","fish","fish","fish","chicken","egg","fish"]);
  let db=shuffle(["chicken","chicken","chicken","egg","egg","fish","chicken"]);
  const L=activeList();
  if(L){
    const w={};L.ids.forEach(id=>{const d=dish(id);if(d&&["fish","chicken","egg","mutton"].includes(d.type))w[d.type]=(w[d.type]||0)+1;});
    const ks=Object.keys(w);
    if(ks.length){const tot=ks.reduce((x,k)=>x+w[k],0);
      const draw=()=>{let r=Math.random()*tot;for(const k of ks){r-=w[k];if(r<0)return k;}return ks[0];};
      lb=[0,1,2,3,4,5,6].map(draw);db=[0,1,2,3,4,5,6].map(draw);}
  }
  S.plan=[];for(let i=0;i<7;i++)S.plan.push(genDay(i,used,lb[i],db[i]));
  applyRepeats();fitWeek();
  S.ck={};S.skip={};S.qo={};S.okv={};S.okm={};S.dn={};S.vn={};S.nosend={};S.lo={};
}
function fitDay(i,force){
  const T=Math.max(1200,+S.target||0);if(!+S.target||(!S.fit&&!force))return 0;let n=0;
  const used=new Set([].concat(...S.plan.map(d=>d.b.concat(d.l,d.d))));
  for(let g=0;g<6;g++){
    const k=planDayK(i);if(k<=T*1.05)break;
    let best=null;
    MK.forEach(m=>S.plan[i][m].forEach((id,ix)=>{const d=dish(id);if(!d||d.type==="staple"||d.type==="own"||d.type==="snack"||isRep(id,m)||S.lo[i+"|"+m+"|"+id])return;if(!best||kcal(d)>kcal(best.d))best={d,m,ix};}));
    if(!best)break;
    const need=k-T,cur=kcal(best.d);
    const alts=allDishes().filter(a=>a.type===best.d.type&&a.veg===best.d.veg&&!S.off.includes(a.id)&&!used.has(a.id)&&kcal(a)<cur*0.85&&mealsOf(a).includes(best.m)).sort((a,b)=>kcal(b)-kcal(a));
    if(!alts.length)break;
    const pick=alts.find(a=>kcal(a)<=cur-need)||alts[alts.length-1];
    S.plan[i][best.m][best.ix]=pick.id;used.add(pick.id);n++;
  }
  return n;
}
function fitWeek(force){let n=0;for(let i=0;i<7;i++)n+=fitDay(i,force);return n;}
function regenDay(i){
  const used=new Set();S.plan.forEach((d,j)=>{if(j!==i)["b","l","d"].forEach(m=>d[m].forEach(x=>used.add(x)));});
  const lt=["fish","fish","chicken","egg"][Math.floor(Math.random()*4)], dt=["chicken","chicken","egg","fish"][Math.floor(Math.random()*4)];
  S.plan[i]=genDay(i,used,lt,dt);setDay(i,false);
  (S.rep||[]).forEach(r=>{if(dish(r.id)&&!S.plan[i][r.m].includes(r.id))S.plan[i][r.m].push(r.id);});
  fitDay(i);
}
function fresh(){
  S={sunStart:true,v:1,ts:1,people:4,vegDays:[],vegN:1,cnDays:[6],weekStart:defaultStart(),plan:[],last:[],off:[],mine:[],ck:{},lists:[],activeList:"",okv:{},cookDays:[5,6,0,1,3],cookTime:"eve",eat:{},extra:{},wt:"",target:"",hist:[],skip:{},qo:{},dn:{},vn:{},rep:[],eatT:{}};

function normalize(o){
  const d={v:1,ts:0,people:4,vegDays:[],vegN:1,cnDays:[6],weekStart:defaultStart(),plan:[],last:[],off:[],mine:[],ck:{},lists:[],activeList:"",okv:{},cookDays:[5,6,0,1,3],cookTime:"eve",eat:{},extra:{},wt:"",target:"",hist:[],skip:{},qo:{},dn:{},vn:{},rep:[],eatT:{}};
  const s=Object.assign(d,o||{});
  ["vegDays","cnDays","last","off","mine","plan","lists","cookDays","hist","rep"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=d[k];});
  if(!s.ck||typeof s.ck!=="object")s.ck={};
  if(!s.okv||typeof s.okv!=="object")s.okv={};
  if(!s.okm||typeof s.okm!=="object"||Array.isArray(s.okm)){s.okm={};if(Array.isArray(s.okd))s.okd.forEach((v,i)=>{if(v)["b","l","d"].forEach(m=>{s.okm[i+"|"+m]=true;});});}
  ["nosend","cookOpt","lo","ovr"].forEach(k=>{if(!s[k]||typeof s[k]!=="object"||Array.isArray(s[k]))s[k]={};});
  if(!Array.isArray(s.calRep))s.calRep=[];
  if(!s.eat||typeof s.eat!=="object")s.eat={};
  if(!s.extra||typeof s.extra!=="object")s.extra={};
  ["skip","qo","dn","vn","eatT"].forEach(k=>{if(!s[k]||typeof s[k]!=="object"||Array.isArray(s[k]))s[k]={};});
  return s;
}
function migrateSunday(){
  if(S.sunStart)return;
  const ws=fromIso(S.weekStart);
  if(ws.getDay()===1&&S.plan.length===7){
    const okDays=new Set();
    try{visits().forEach(v=>{if(S.okv&&S.okv[v.id])v.slots.forEach(([i])=>okDays.add(i));});}catch(e){}
    const sh=i=>(+i+1)%7;
    S.weekStart=iso(addDays(ws,-1));
    S.plan=[S.plan[6]].concat(S.plan.slice(0,6));
    const rk=o=>{const n={};for(const k in o){const p=k.split("|");if(/^\d+$/.test(p[0])){p[0]=String(sh(p[0]));n[p.join("|")]=o[k];}else n[k]=o[k];}return n;};
    S.eat=rk(S.eat||{});S.dn=rk(S.dn||{});
    const ri=o=>{const n={};for(const k in o)n[sh(k)]=o[k];return n;};
    S.extra=ri(S.extra||{});
    S.okm={};[0,1,2,3,4,5,6].forEach(i=>{if(okDays.has((i+6)%7))MK.forEach(m=>{S.okm[i+"|"+m]=true;});});
  }
  S.okv={};S.eatT={};S.sunStart=true;
}
function load(){
  try{const t=localStorage.getItem(KEY);if(t){S=normalize(JSON.parse(t));}}catch(e){}
  if(S&&S.plan.length===7)migrateSunday();
  if(S)applyOvr();
  if(!S||S.plan.length!==7){const keep=S;fresh();if(keep){S.mine=keep.mine;S.off=keep.off;S.lists=keep.lists||[];}}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}

async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;

/* ---------- Quantities and lists ---------- */
function fmt(q,u){
  if(u==="g"||u==="ml"){
    let r=q>=200?Math.round(q/50)*50:Math.max(10,Math.round(q/10)*10);
    if(r>=1000)return (Math.round(r/100)/10)+(u==="g"?" kg":" L");
    return r+" "+u;
  }
  const n=Math.max(1,Math.ceil(q-1e-9));
  if(u==="pc"||!u)return String(n);
  return n+" "+(n>1?(u==="bunch"?"bunches":u+"s"):u);
}
function scale(){return S.people/4;}
function useLine(d){return d.ing.filter(x=>x.q).map(x=>x.n+" "+fmt(x.q*scale(),x.u)).join(", ");}
function shopping(only){
  const items={},pantry=new Set(PANTRY);
  okVisits().filter(v=>!only||!only.length||only.includes(v.id)).forEach(v=>okSlots(v).forEach(([i,m])=>S.plan[i][m].forEach(id=>{
    const d=dish(id);if(!d||S.lo[i+"|"+m+"|"+id])return;const mult=1+loFor(i,m,id).length;
    d.ing.forEach(x=>{
      if(x.c==="P"||!x.q){pantry.add(x.n);return;}
      const k=x.n+"|"+x.u;const it=items[k]||(items[k]={k,n:x.n,u:x.u,c:x.c,q:0,days:[]});
      it.q+=x.q*scale()*mult;if(!it.days.includes(v.short))it.days.push(v.short);
    });
  })));
  const list=Object.values(items).sort((a,b)=>a.n.localeCompare(b.n));
  return {F:list.filter(x=>x.c==="F"),E:list.filter(x=>x.c==="E"),V:list.filter(x=>x.c==="V"),G:list.filter(x=>x.c==="G"),P:[...pantry]};
}

function nextSlots(i,m,d){
  const out=[];
  if(m==="b"){out.push([i,"l"],[i,"d"]);}
  else if(m==="l"){out.push([i,"d"]);if(i<6)out.push([i+1,"l"],[i+1,"d"]);}
  else if(i<6){out.push([i+1,"l"],[i+1,"d"],[i+1,"b"]);}
  return out;
}

function loFor(i,m,id){const k=i+"|"+m+"|"+id;const out=[];for(const t in S.lo)if(S.lo[t]===k){const p=t.split("|");out.push(slotName(+p[0],p[1]));}return out;}

function estOwn(name){
  const ws=String(name).toLowerCase().split(/[^a-z]+/).filter(w=>w.length>2&&!["with","and","the","light","style","home"].includes(w));
  let best=[];let top=0;
  allDishes().forEach(d=>{if(d.type==="own")return;const nm=d.name.toLowerCase();const sc=ws.filter(w=>nm.includes(w)).length;if(!sc)return;if(sc>top){top=sc;best=[d];}else if(sc===top)best.push(d);});
  if(!best.length)return {k:250,p:8,veg:!/(egg|dim|chicken|murgi|fish|mach|maach|mutton|prawn|chingri|keema)/.test(String(name).toLowerCase()),from:""};
  best=best.slice(0,10);
  return {k:Math.round(best.reduce((a,d)=>a+kcal(d),0)/best.length/5)*5,p:Math.round(best.reduce((a,d)=>a+prot(d),0)/best.length),veg:best.filter(d=>d.veg).length>=best.length/2,from:best.slice(0,2).map(d=>d.name).join(", ")};
}

function salvage(text){
  /* pull out every complete {...} object, even if the list was cut off */
  const out=[];let depth=0,start=-1,inStr=false,esc2=false;
  const t=String(text||"");const from=Math.max(0,t.search(/<dishes>|\[\s*\{/));
  for(let i=from;i<t.length;i++){const c=t[i];
    if(inStr){if(esc2)esc2=false;else if(c==="\\")esc2=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==="{"){if(depth===0)start=i;depth++;}
    else if(c==="}"&&depth>0){depth--;if(depth===0&&start>=0){try{const o=JSON.parse(t.slice(start,i+1));if(o&&o.name)out.push(o);}catch(e){}start=-1;}}
  }
  return out;
}
const TYPEMAP={breakfast:"bf",bf:"bf",dal:"dal",lentil:"dal",lentils:"dal",side:"side",veg:"side",vegetable:"side",sabzi:"side",fish:"fish",prawn:"fish",seafood:"fish",chicken:"chicken",egg:"egg",eggs:"egg",mutton:"mutton",goat:"mutton",lamb:"mutton",vegmain:"vegmain",paneer:"vegmain",cncarb:"cncarb",noodles:"cncarb",rice:"cncarb",cnmain:"cnmain",chinese:"cnmain",soup:"cnmain"};
function normType(o){
  const raw=String(o.type||"").toLowerCase();
  if(TYPES[raw]&&raw!=="staple")return raw;
  for(const k in TYPEMAP)if(raw.includes(k))return TYPEMAP[k];
  const meal=String(o.meal||"").toLowerCase();if(meal==="breakfast")return "bf";
  const txt=(String(o.name||"")+" "+JSON.stringify(o.ing||o.ingredients||"")).toLowerCase();
  if(/chingri|prawn|fish|maach|mach|ilish|rui|katla|bhetki|pabda|pomfret/.test(txt))return "fish";
  if(/chicken|murgi/.test(txt))return "chicken";
  if(/mutton|pathar|keema/.test(txt))return "mutton";
  if(/\begg|dim\b|dimer/.test(txt))return "egg";
  if(/dal\b|daal/.test(txt))return "dal";
  return o.veg===false?"fish":"side";
}
let WHEREMAP=null;
function guessWhere(n){
  if(!WHEREMAP){WHEREMAP={};BUILTIN.forEach(d=>d.ing.forEach(x=>{WHEREMAP[ingKey(x.n)]=x.c;}));}
  const k=ingKey(n);if(WHEREMAP[k])return WHEREMAP[k];
  for(const key in WHEREMAP)if(key.length>3&&(k.includes(key)||key.includes(k)))return WHEREMAP[key];
  if(/fish|prawn|chingri|chicken|mutton|maach|keema/i.test(n))return "F";
  if(/\begg/i.test(n))return "E";
  if(/dal|rice|flour|atta|oil|sauce|powder|seeds|masala|paneer|curd|milk|noodle|besan|suji|poha|chire/i.test(n))return "G";
  return "V";
}
function normIng(list){
  return (Array.isArray(list)?list:[]).map(x=>{
    if(typeof x==="string")return {n:x.slice(0,40),q:0,u:"g",c:"G"};
    if(!x)return null;
    const n=String(x.n||x.name||x.item||"").slice(0,40);if(!n)return null;
    let q=x.q!=null?x.q:x.qty!=null?x.qty:x.quantity;let u=x.u||x.unit||"";
    if(typeof q==="string"){const m=q.match(/([\d.]+)\s*([a-z]*)/i);if(m){q=+m[1];if(!u)u=m[2];}else q=0;}
    u=String(u).toLowerCase();u=/^(g|gm|gram|grams)$/.test(u)?"g":/^(kg)$/.test(u)?(q=(+q||0)*1000,"g"):/^(ml)$/.test(u)?"ml":/^(l|litre|liter)$/.test(u)?(q=(+q||0)*1000,"ml"):/bunch/.test(u)?"bunch":/pack/.test(u)?"pack":/^(pc|pcs|piece|pieces|no|nos|)$/.test(u)?"pc":"g";
    const c=String(x.c||x.where||"").toUpperCase();
    return {n,q:+q||0,u,c:WHERE[c]?c:guessWhere(n)};
  }).filter(Boolean).slice(0,10);
}
function findDishes(text){
  text=String(text||"");const tries=[];
  const tag=text.match(/<dishes>([\s\S]*?)<\/dishes>/i);if(tag)tries.push(tag[1]);
  const fence=text.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence)tries.push(fence[1]);
  for(const t of tries){try{const v=JSON.parse(t.trim());if(Array.isArray(v))return v;}catch(e){}}
  const end=text.lastIndexOf("]");if(end<0)return [];
  for(let i=text.lastIndexOf("[",end);i>=0;i=text.lastIndexOf("[",i-1)){
    try{const v=JSON.parse(text.slice(i,end+1));if(Array.isArray(v)&&v.length&&v[0]&&v[0].name)return v;}catch(e){}
    if(i===0)break;
  }
  return [];
}
function addIdeas(out,forceMeal){
  const ids=[];
  (Array.isArray(out)?out:[]).forEach((o,n)=>{
    if(!o||typeof o.name!=="string"||!o.name.trim())return;
    o.type=normType(o);
    if(typeof o.veg!=="boolean")o.veg=!["fish","chicken","egg","mutton"].includes(o.type);
    const old=allDishes().find(d=>d.name.toLowerCase()===o.name.toLowerCase());
    if(old){ids.push(old.id);return;}
    const ing=normIng(o.ing||o.ingredients);
    const mm=forceMeal||{breakfast:"b",lunch:"l",dinner:"d"}[String(o.meal||"").toLowerCase()]||"";
    const d={id:"u"+Date.now().toString(36)+n,name:o.name.trim().slice(0,60),type:o.type,veg:!!o.veg,ing,note:String(o.note||o.instructions||o.tip||"").slice(0,300),mine:true,ai:true};
    if(mm)d.meal=mm;if(o.type==="bf")d.meal="b";
    S.mine.push(d);ids.push(d.id);
  });
  return ids;
}
/* Ask Claude. opts: {meal:"any"|"breakfast"|"lunch"|"dinner", veg:"both"|"veg"|"non", count, wish} */
async function askClaude(opts){
  const forceMeal={breakfast:"b",lunch:"l",dinner:"d"}[opts.meal]||"";
  const have=shuffle(allDishes().filter(d=>!d.gen)).map(d=>d.name);
  if(aiReady()){
    let r,j;
    try{
      r=await fetch(AI.url.replace(/\/+$/,""),{method:"POST",headers:{"Content-Type":"application/json","x-rannaghar-token":AI.token},
        body:JSON.stringify({have,search:!!AI.web,meal:opts.meal,veg:opts.veg,count:opts.count,wish:[opts.wish,opts.meal!=="any"?"All for "+opts.meal+".":"",opts.veg==="veg"?"Vegetarian only.":opts.veg==="non"?"Non-vegetarian only.":"Half veg, half non-veg.","For each dish add a field meal: breakfast, lunch or dinner."].filter(Boolean).join(" ")})});
    }catch(e){return {error:"Could not reach your Worker. Check the Worker link in the Settings tab, and that you are online."};}
    j=await r.json().catch(()=>({}));
    if(r.status===401)return {error:"The passcode in Settings does not match APP_TOKEN on your Worker."};
    if(!r.ok)return {error:(j.error||"The Worker answered with error "+r.status)+"."};
    if(j.usd){const k=monthKey();AI.spend[k]=(AI.spend[k]||0)+j.usd;}
    const entry={t:Date.now(),what:opts.label||"Claude ideas",usd:j.usd||0,tin:j.tin||0,tout:j.tout||0,s:j.searches||0,n:0};
    AI.log=(AI.log||[]);AI.log.unshift(entry);AI.log=AI.log.slice(0,200);saveAI();
    let list=Array.isArray(j.dishes)?j.dishes.filter(o=>o&&o.name):[];
    if(!list.length)list=findDishes(j.text);
    if(!list.length&&j.text)list=salvage(j.text);
    const ids=addIdeas(list,forceMeal);
    entry.n=ids.length;saveAI();
    if(!ids.length){
      const why=j.stop==="max_tokens"?" Claude's answer was cut off.":list.length?" Claude sent "+list.length+" items in an unexpected shape.":"";
      return {error:"Claude answered but no dishes could be read."+why+(j.version>=4?"":" Your Worker is an old version: update it from GitHub.")+(j.text?" Claude said: "+String(j.text).replace(/\s+/g," ").slice(0,200):"")+" Please try once more.",usd:j.usd};
    }
    save();return {ids,usd:j.usd||0,searched:j.searched,old:!(j.version>=3)};
  }
  if(sampleFn){
    const prompt="Suggest "+opts.count+" home-style low-oil dishes for a Bengali family in Kolkata, not in this list: "+have.join("; ")+". "+(opts.wish||"")+
      (opts.meal!=="any"?" All for "+opts.meal+".":" Spread across breakfast, lunch and dinner.")+(opts.veg==="veg"?" Vegetarian only.":opts.veg==="non"?" Non-vegetarian only.":" Half veg, half non-veg.")+
      " Return ONLY a JSON array of {name, meal:breakfast|lunch|dinner, type: bf|dal|side|fish|chicken|egg|mutton|vegmain|cncarb|cnmain, veg:boolean, ing:[{n,q (for 4 people),u:g|ml|pc|bunch|pack,c:F|E|V|G|P}], note}.";
    try{let out=await sampleFn.json(prompt);if(out&&!Array.isArray(out)&&Array.isArray(out.dishes))out=out.dishes;const ids=addIdeas(out,forceMeal);if(!ids.length)return {error:"No usable ideas came back. Try again."};save();return {ids,usd:0};}
    catch(e){return {error:"Could not get ideas just now. Try again in a minute."};}
  }
  return {error:"Claude is not connected. Open the Settings tab, paste your Worker link and passcode, and tap Save connection."};
}

  else if(a==="okAll"){for(let j=0;j<7;j++)setDay(j,true);save();render();toast("Whole week approved. Cook and Shop are ready.");}
  else if(a==="okNone"){S.okm={};save();render();}
  else if(a==="useSg"){S.target=suggestTarget();save();render();}
  else if(a==="okMeal"){const k=i+"|"+b.dataset.m;if(S.okm[k])delete S.okm[k];else S.okm[k]=true;save();render();if(S.okm[k])toast(slotName(i,b.dataset.m)+" approved. It is now in Cook and Shop.");}
  else if(a==="day"){regenDay(i);save();render();toast(label(i)+" reshuffled. Approve it again when it looks right.");}
  else if(a==="fitNow"){const n=fitWeek(true);save();render();toast(n?n+" dishes swapped for lighter ones. Check the Menu and approve again if needed.":"This week is already close to your target.");}
  else if(a==="okDay"){const on=!dayOk(i);setDay(i,on);save();render();if(on)toast(label(i)+" approved. It is now in Cook and Shop.");}
  else if(a==="slotIdeas")slotSheet(i,b.dataset.m);
  else if(a==="slotMore"&&sheetCtx)openSlot();
  else if(a==="slotAdd"&&sheetCtx&&sheetCtx.slot){S.plan[sheetCtx.i][sheetCtx.m].push(b.dataset.id);save();const ctx=sheetCtx;render();sheetCtx=ctx;b.textContent="Added";b.disabled=true;}
  else if(a==="view2"){const d=dish(b.dataset.id);if(d){const el=$("slotMsg");if(el){el.hidden=false;el.classList.remove("err");el.textContent=d.name+": "+(d.note||"")+(useLine(d)?" Uses: "+useLine(d):"");}}}
  else if(a==="slotClaude"&&sheetCtx&&sheetCtx.slot){
    const ctx=sheetCtx;b.disabled=true;b.textContent="Asking Claude…";setStatus("slotMsg","Asking Claude. This can take up to a minute.",false);
    askClaude({label:"Ideas for "+slotName(ctx.i,ctx.m),meal:MEALKEY[ctx.m],veg:"both",count:4,wish:""}).then(r=>{
      if(sheetCtx!==ctx)return;
      if(r.error){b.disabled=false;b.textContent="Ask Claude again";setStatus("slotMsg",r.error,true);return;}
      slotWeb=r.ids;openSlot();setStatus("slotMsg",r.ids.length+" ideas from Claude, shown at the top."+costLine(r),false);
    });}
  else if(a==="likeClaude"&&sheetCtx&&!sheetCtx.slot){
    const ctx=sheetCtx;const d=dish(S.plan[ctx.i][ctx.m][ctx.k]);if(!d)return;
    b.disabled=true;b.textContent="Asking Claude…";setStatus("likeMsg","Asking Claude. This can take up to a minute.",false);
    askClaude({label:"Like "+d.name,meal:MEALKEY[ctx.m],veg:d.veg?"veg":"non",count:4,wish:"Dishes similar to "+d.name+" ("+TYPES[d.type]+")."}).then(r=>{
      if(sheetCtx!==ctx)return;b.disabled=false;b.textContent="Ask Claude again";
      if(r.error){setStatus("likeMsg",r.error,true);return;}
      setStatus("likeMsg",r.ids.length+" ideas from Claude. Replace the dish, or add one too."+costLine(r),false);
      const el=$("likeList");if(el)el.innerHTML='<h3>New from Claude</h3>'+r.ids.map(dish).filter(Boolean).map(twoBtnRow).join("");
    });}
  else if(a==="vegN"){S.vegN=+b.dataset.n;save();render();}
  else if(a==="useList"){S.activeList=b.dataset.id;save();render();}
  else if(a==="listNow"){const id=b.dataset.id;twoTap(b,()=>{S.activeList=id;genWeek();save();tab="week";render();});}
  else if(a==="listView"){const L=listById(b.dataset.id);if(L){if(L.ready)readyView(L);else listSheet(L);}}
  else if(a==="listCopy"){const L=listById(b.dataset.id);if(L)listSheet(L);}
  else if(a==="listNew")listSheet(null);
  else if(a==="listSave"&&listDraft){
    const name=$("lname").value.trim();if(!name){$("lmsg").textContent="Give the list a name first.";return;}
    if(!listDraft.ids.size){$("lmsg").textContent="Tick at least a few dishes.";return;}
    const L={id:listDraft.id||"L"+Date.now().toString(36),name,ids:[...listDraft.ids]};
    S.lists=S.lists||[];const at=S.lists.findIndex(x=>x.id===L.id);if(at>=0)S.lists[at]=L;else S.lists.push(L);
    save();listDraft=null;closeSheet();render();}
  else if(a==="listDel"&&listDraft){const id=listDraft.id;S.lists=S.lists.filter(x=>x.id!==id);if(S.activeList===id)S.activeList="";save();listDraft=null;closeSheet();render();}
  else if(a==="aiTest"){
    setStatus("testMsg","Checking your Worker…",false);
    fetch(AI.url.replace(/\/+$/,""),{method:"POST",headers:{"Content-Type":"application/json","x-rannaghar-token":AI.token},body:JSON.stringify({ping:true})})
     .then(async r=>{const j=await r.json().catch(()=>({}));
       if(r.status===401)setStatus("testMsg","Reached the Worker, but the passcode does not match APP_TOKEN.",true);
       else if(!r.ok)setStatus("testMsg","The Worker answered with an error: "+(j.error||r.status),true);
       else if(j.ok&&j.version>=4)setStatus("testMsg","All good. Worker version "+j.version+" is connected and the passcode matches.",false);
       else setStatus("testMsg","Connected, but your Worker is an old version. Paste the new code from worker/rannaghar-worker.js on GitHub into Cloudflare and deploy.",true);})
     .catch(()=>setStatus("testMsg","Could not reach the Worker. Check the link: it should look like https://rannaghar.yourname.workers.dev",true));}
  else if(a==="calDay"){calDay=i;render();}
  else if(a==="eatPick"){const k=calDay+"|x|"+b.dataset.id;S.eat[k]=(S.eat[k]||0)+1;save();render();toast((dish(b.dataset.id)||{}).name+" added to "+label(calDay)+".");}
  else if(a==="eq"){const k=b.dataset.k;const i0=+k.split("|")[0];const cur=effEat(i0)[k]||0;S.eat[k]=Math.max(0,cur+(+b.dataset.d));save();render();}
  else if(a==="editOwn")editOwn(b.dataset.id);
  else if(a==="qReset"&&QO&&QO.edit){resetOvr(QO.edit);save();QO=null;closeSheet();render();toast("Back to the original recipe.");}
  else if(a==="qDel"&&QO&&QO.edit){const id=QO.edit;twoTap(b,()=>{delOwn(id);QO=null;closeSheet();render();toast("Deleted from everywhere.");},"Tap again to delete everywhere");}
  else if(a==="eatRm"){if((S.calRep||[]).includes(b.dataset.k.split("|")[2]))toast("Removed for this day. To stop it every day, tap ↻ on another day.");const k=b.dataset.k;const id=k.split("|")[2];if((S.calRep||[]).includes(id)&&k.split("|")[1]==="x")S.eat[k]=0;else delete S.eat[k];if(S.eat[k]===0&&!(S.calRep||[]).includes(id))delete S.eat[k];save();render();}
  else if(a==="eatRep"){const id=b.dataset.id;S.calRep=S.calRep||[];if(S.calRep.includes(id)){S.calRep=S.calRep.filter(x=>x!==id);toast("Stopped adding it every day.");}else{S.calRep.push(id);for(const k in S.eat){const p=k.split("|");if(p[2]===id&&p[1]!=="x")delete S.eat[k];}toast((dish(id)||{}).name+" will be counted every day up to today. × removes it for one day.");}save();render();}
  else if(a==="eatCopy"){const prev=effEat(calDay-1);for(const k in prev){const p=k.split("|");if(p[1]==="x"&&(S.calRep||[]).includes(p[2]))continue;p[0]=String(calDay);S.eat[p.join("|")]=prev[k];}(S.extra[calDay-1]||[]).forEach(e=>{(S.extra[calDay]=S.extra[calDay]||[]).push(Object.assign({},e));});save();render();}
  else if(a==="eatAll"){let n=0;MK.forEach(m=>S.plan[calDay][m].forEach(id=>{const k=calDay+"|"+m+"|"+id;if(!(k in S.eat)){S.eat[k]=1;n++;}}));save();render();toast(n?n+" dishes added. Change servings or remove what you did not eat.":"Everything from the menu is already here.");}
  else if(a==="eatClr"){for(const k in S.eat)if(+k.split("|")[0]===calDay)delete S.eat[k];(S.calRep||[]).forEach(id=>{S.eat[calDay+"|x|"+id]=0;});delete S.extra[calDay];save();render();}
  else if(a==="qOwn")ownSheet(b.dataset.n,b.dataset.c);
  else if(a==="qVeg"&&QO){QO.veg=b.dataset.v==="1";document.querySelectorAll('[data-act="qVeg"]').forEach(x=>x.setAttribute("aria-pressed",String(x===b)));}
  else if(a==="qSave"&&QO)qSave();
  else if(a==="qBuild"&&QO){const n=$("qN").value;const c=QO.c,x=QO.ctx;QO=null;if(c==="cal")bOpen({kind:"cal",day:calDay});else if(x)bOpen({kind:"menu",i:x.i,m:x.m});else bOpen({kind:"cal",day:calDay});BLD.name=n;bRender();}
  else if(a==="exAdd"){touchDay(calDay);const n=$("exN").value.trim(),k=+$("exK").value;if(!n||!(k>0)){toast("Type what it was and its calories.");return;}(S.extra[calDay]=S.extra[calDay]||[]).push({n:n.slice(0,60),k:Math.round(k)});save();render();}
  else if(a==="exRm"){(S.extra[calDay]||[]).splice(+b.dataset.n,1);save();render();}
  else if(a==="logClear"){twoTap(b,()=>{AI.log=[];saveAI();render();},"Tap again to clear");}
  else if(a==="aiClear"){AI.url="";AI.token="";saveAI();render();}
  else if(a==="aiSave"){AI.url=$("aiUrl").value.trim();AI.token=$("aiTok").value.trim();saveAI();setOpen=true;render();const st=$("aiState");if(st)st.textContent=aiReady()?"Connected. Ideas through web is ready on the Dishes tab.":"Add both the Worker link and the passcode.";}
  else if(a==="free"){const keep=freeG;freePick();["b","l","d"].forEach(k=>{if(k!==ideaMeal)freeG[k]=keep[k];});ideaStatus="";render();}
  else if(a==="toMenu")toMenuSheet(b.dataset.id,b.dataset.m);
  else if(a==="placeIt"&&sheetCtx){const nm=(dish(sheetCtx.id)||{}).name||"Dish";S.plan[i][b.dataset.m].push(sheetCtx.id);save();closeSheet();toast(nm+" added to "+label(i)+" "+MEALNAME[b.dataset.m].toLowerCase()+"."+(slotOk(i,b.dataset.m)?" Bazaar and Cook lists updated.":" Approve that cook visit on the Menu tab to add it to the lists."));render();}
  else if(a==="backup"){try{const bl=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const u=URL.createObjectURL(bl);const l=document.createElement("a");l.href=u;l.download="rannaghar-backup-"+iso(new Date())+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);$("bkMsg").textContent="Backup saved to your Downloads.";}catch(err){textSheet(JSON.stringify(S));}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.li&&listDraft){if(t.checked)listDraft.ids.add(t.dataset.li);else listDraft.ids.delete(t.dataset.li);countDraft();}
  else if(BLD&&t.dataset&&(t.dataset.bf!=null||t.dataset.bq!=null||t.dataset.bu!=null||t.dataset.bk!=null)){
    bReadText();
    if(t.dataset.bf!=null){const r=BLD.rows[+t.dataset.bf];r.f=t.value;const f=foodBy(t.value);if(f&&!unitsFor(f).includes(r.u))r.u=unitsFor(f)[0];}
    else if(t.dataset.bq!=null)BLD.rows[+t.dataset.bq].q=t.value;
    else if(t.dataset.bu!=null)BLD.rows[+t.dataset.bu].u=t.value;
    else BLD.rows[+t.dataset.bk].kc=t.value;
    bRender();}
  else if(t.dataset&&t.dataset.cs){const k=t.dataset.cs;if(t.checked)delete S.nosend[k];else S.nosend[k]=true;save();render();}
  else if(t.dataset&&t.dataset.tk){const k=t.dataset.tk;if(k.startsWith("P|")){if(t.checked)S.ck[k]=true;else delete S.ck[k];}else{if(t.checked)delete S.skip[k];else S.skip[k]=true;}save();render();}
  else if(t.dataset&&t.dataset.qo){const v=t.value.trim();if(v)S.qo[t.dataset.qo]=v;else delete S.qo[t.dataset.qo];save();render();}
  else if(t.dataset&&t.dataset.dq){const k=t.dataset.dq;const o=S.dn[k]||{};o.q=t.value.trim();S.dn[k]=o;save();render();}
  else if(t.dataset&&t.dataset.dnn){const k=t.dataset.dnn;const o=S.dn[k]||{};o.n=t.value.trim();S.dn[k]=o;save();render();}
  else if(t.dataset&&t.dataset.vn){S.vn[t.dataset.vn]=t.value.trim();save();render();}
  else if(t.id==="restore"&&t.files&&t.files[0]){t.files[0].text().then(tx=>{const o=JSON.parse(tx);if(!Array.isArray(o.plan)||o.plan.length!==7)throw 0;S=normalize(o);save();render();setOpen=true;}).catch(()=>{const m=$("bkMsg");if(m)m.textContent="That file is not a Rannaghar backup.";});}
  else if(t.id==="aiUrl"||t.id==="aiTok"){AI.url=$("aiUrl").value.trim();AI.token=$("aiTok").value.trim();saveAI();}
  else if(t.id==="wt"){S.wt=t.value;save();render();}
  else if(t.id==="fit"){S.fit=t.checked;save();render();if(S.fit)toast("New menus will stay near "+nf(S.target)+" kcal a day by swapping heavier dishes for lighter ones of the same kind.");}
  else if(t.id==="twt"){S.twt=t.value;save();render();}
  else if(t.id==="target"){S.target=t.value?+t.value:"";save();render();}
  else if(t.id==="ws"&&t.value){S.weekStart=t.value;save();render();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q")$("pickList").innerHTML=pickList(e.target.value);
  else if(e.target.id==="eatQ"){const q=e.target.value.trim().toLowerCase();const el=$("eatList");if(!q){el.innerHTML="";return;}
    const hits=allDishes().filter(d=>d.name.toLowerCase().includes(q)).sort((a,b)=>(a.type==="snack"?0:1)-(b.type==="snack"?0:1)).slice(0,25);
    el.innerHTML=hits.map(d=>'<div class="lib"><span>'+esc(d.name)+' <span class="kc">'+kcal(d)+' kcal</span></span><button class="btn plain small" data-act="eatPick" data-id="'+d.id+'">Add</button></div>').join("")+ownBtn(e.target.value,"cal");}
  else if(e.target.id==="dq"){dishQ=e.target.value.trim();$("dlist").innerHTML=dishListHtml();}
  else if(e.target.id==="slotQ"){const q=e.target.value.trim().toLowerCase();const el=$("slotList");if(!el)return;if(!q){el.innerHTML="";return;}
    el.innerHTML=allDishes().filter(x=>x.type!=="staple"&&(x.name.toLowerCase().includes(q)||TYPES[x.type].toLowerCase().includes(q)||x.ing.some(y=>y.n.toLowerCase().includes(q)))).slice(0,30).map(x=>'<div class="lib"><span>'+esc(x.name)+' <span class="pill tag">'+esc(TYPES[x.type])+'</span></span><button class="btn plain small" data-act="slotAdd" data-id="'+x.id+'">Add</button></div>').join("")+ownBtn(e.target.value,"slot");}
  else if(e.target.id==="lq"&&listDraft){listDraft.q=e.target.value.trim();$("lrows").innerHTML=listRows();}
  else if(e.target.id==="swapQ"){const q=e.target.value.trim().toLowerCase();if(!q)return;
    $("swapList").innerHTML=allDishes().filter(x=>x.type!=="staple"&&(x.name.toLowerCase().includes(q)||TYPES[x.type].toLowerCase().includes(q)||x.ing.some(y=>y.n.toLowerCase().includes(q)))).slice(0,40).map(twoBtnRow).join("")+ownBtn(e.target.value,"swap");}
});

load();
(function(){const t=iso(new Date());for(let i=0;i<7;i++)if(iso(dateOf(i))===t)cookDay=i;})();
render();
initRemote();
if(location.protocol==="https:"&&"serviceWorker" in navigator&&!window.claude){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
