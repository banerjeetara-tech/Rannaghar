<style>
/* Layout idea: phone app shell. Fixed header, scrolling day cards, bottom tab bar. */
:root{
  --bg:#f6ece0; --card:#fffaf2; --ink:#2b2118; --muted:#7a6a5a; --line:#e4d5c1;
  --accent:#b4532a; --accent-ink:#fff8f0; --soft:#f0e0cc;
  --veg:#3f7d4e; --veg-bg:#e2efdf; --cn:#8a5a12; --cn-bg:#f6e6c4;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1d1712; --card:#28201a; --ink:#f3e8da; --muted:#b3a290; --line:#3d3229;
    --accent:#e08a5c; --accent-ink:#22150d; --soft:#342a22;
    --veg:#8fcf9d; --veg-bg:#22362a; --cn:#e6c27a; --cn-bg:#3a2f18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1d1712; --card:#28201a; --ink:#f3e8da; --muted:#b3a290; --line:#3d3229;
  --accent:#e08a5c; --accent-ink:#22150d; --soft:#342a22;
  --veg:#8fcf9d; --veg-bg:#22362a; --cn:#e6c27a; --cn-bg:#3a2f18;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{padding:14px 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.sync{color:var(--muted);font-size:11px;text-align:right;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;border:0;padding:11px 4px 12px;font-weight:600;font-size:13px;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card.today{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.veg{background:var(--veg-bg);color:var(--veg)}
.pill.cn{background:var(--cn-bg);color:var(--cn)}
.pill.tag{background:var(--soft);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;text-align:left}
.chip.add{background:none;border-style:dashed;color:var(--muted);padding:6px 11px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 10px;font-size:12px}
.btn.plain{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tog{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
details summary{cursor:pointer;font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700}
.stepper b{font-variant-numeric:tabular-nums;min-width:20px;text-align:center}
.dish{padding:8px 0;border-top:1px solid var(--line)}
.dish:first-of-type{border-top:0}
.dish b{font-weight:600}
.note{color:var(--muted);font-size:13.5px;margin-top:2px}
.use{font-size:12.5px;color:var(--muted);margin-top:2px;font-style:italic}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex:none}
.item label{flex:1;display:flex;justify-content:space-between;gap:10px}
.item .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item .d{display:block;font-size:12px;color:var(--muted)}
.item.done label{text-decoration:line-through;color:var(--muted)}
.lib{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lib:first-of-type{border-top:0}
.lib .nm{background:none;border:0;padding:0;text-align:left;flex:1}
.lib.off .nm{color:var(--muted);text-decoration:line-through}
.hint{font-size:12.5px;color:var(--muted)}
#sheet{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,6,.5)}
.sheet-body{position:relative;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px 22px;max-height:86%;overflow-y:auto;max-width:640px;width:100%;margin:0 auto}
.pick{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.ing{display:grid;grid-template-columns:1fr 62px 74px 88px;gap:5px;margin-top:5px}
.ing input,.ing select{padding:7px 6px;font-size:13px}
@media (max-width:380px){.ing{grid-template-columns:1fr 54px 66px 80px}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tog{transition:background .15s}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Rannaghar</h1><div class="sub" id="weekLabel"></div></div>
    <div class="sync" id="sync">Saved on this phone</div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="week">Menu</button>
    <button data-tab="cook">Cook</button>
    <button data-tab="shop">Shopping</button>
    <button data-tab="dishes">Dishes</button>
  </nav>
</div>
<div id="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-body" id="sheetBody"></div></div>

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fromIso(s){const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function dateOf(i){return addDays(fromIso(S.weekStart),i);}
function label(i,long){const d=dateOf(i);return DAY[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function defaultStart(){const t=new Date();const wd=t.getDay();const back=(wd+6)%7;let m=addDays(t,-back);if(wd===0||wd>=5)m=addDays(m,7);return iso(m);}

function allDishes(){return BUILTIN.concat(S.mine||[]);}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function pick(type,vegOnly,used){
  let pool=allDishes().filter(d=>d.type===type&&!S.off.includes(d.id)&&(!vegOnly||d.veg));
  if(!pool.length)pool=allDishes().filter(d=>d.type===type&&(!vegOnly||d.veg));
  if(!pool.length)return null;
  const fresh=pool.filter(d=>!used.has(d.id));
  const pref=fresh.filter(d=>!S.last.includes(d.id));
  const from=pref.length?pref:(fresh.length?fresh:pool);
  const d=from[Math.floor(Math.random()*from.length)];
  used.add(d.id);return d.id;
}
function genDay(i,used,lt,dt){
  const wd=dateOf(i).getDay(), veg=S.vegDays.includes(wd), cn=S.cnDays.includes(wd);
  const day={b:[],l:[],d:[]};
  const push=(arr,id)=>{if(id)arr.push(id);};
  push(day.b,pick("bf",veg,used));
  let lType=veg?"vegmain":(wd===0?(Math.random()<.6?"mutton":"chicken"):lt);
  day.l.push("st1");push(day.l,pick("dal",true,used));push(day.l,pick("side",true,used));push(day.l,pick(lType,veg,used));
  if(cn){push(day.d,pick("cncarb",veg,used));push(day.d,pick("cnmain",veg,used));}
  else{
    let dType=veg?"vegmain":dt;
    if(!veg&&dType===lType)dType=["chicken","egg","fish"].filter(t=>t!==lType)[Math.floor(Math.random()*2)];
    day.d.push("st2");push(day.d,pick(dType,veg,used));
  }
  return day;
}
function genWeek(){
  const used=new Set();
  const lb=shuffle(["fish","fish","fish","fish","chicken","egg","fish"]);
  const db=shuffle(["chicken","chicken","chicken","egg","egg","fish","chicken"]);
  S.plan=[];for(let i=0;i<7;i++)S.plan.push(genDay(i,used,lb[i],db[i]));
  S.ck={};
}

}

function normalize(o){
  const d={v:1,ts:0,people:4,vegDays:[4],cnDays:[6],weekStart:defaultStart(),plan:[],last:[],off:[],mine:[],ck:{}};

}

function fmt(q,u){
  if(u==="g"||u==="ml"){
    let r=q>=200?Math.round(q/50)*50:Math.max(10,Math.round(q/10)*10);
    if(r>=1000)return (Math.round(r/100)/10)+(u==="g"?" kg":" L");
    return r+" "+u;
  }
  const n=Math.max(1,Math.ceil(q-1e-9));
  if(u==="pc"||!u)return String(n);
  return n+" "+(n>1?(u==="bunch"?"bunches":u+"s"):u);
}
function scale(){return S.people/4;}
function useLine(d){return d.ing.filter(x=>x.q).map(x=>x.n+" "+fmt(x.q*scale(),x.u)).join(", ");}
function shopping(){
  const items={},pantry=new Set(PANTRY);
  S.plan.forEach((day,i)=>["b","l","d"].forEach(m=>day[m].forEach(id=>{
    const d=dish(id);if(!d)return;
    d.ing.forEach(x=>{
      if(x.c==="P"||!x.q){pantry.add(x.n);return;}
      const k=x.n+"|"+x.u;const it=items[k]||(items[k]={k,n:x.n,u:x.u,c:x.c,q:0,days:[]});
      it.q+=x.q*scale();const dn=DAY[dateOf(i).getDay()];if(!it.days.includes(dn))it.days.push(dn);
    });
  })));
  const list=Object.values(items).sort((a,b)=>a.n.localeCompare(b.n));
  return {F:list.filter(x=>x.c==="F"),E:list.filter(x=>x.c==="E"),V:list.filter(x=>x.c==="V"),G:list.filter(x=>x.c==="G"),P:[...pantry]};
}

  const opt=(arr,v)=>arr.map(a=>'<option value="'+a[0]+'"'+(a[0]===v?" selected":"")+'>'+a[1]+'</option>').join("");
  return '<div class="ing"><input type="text" class="in" placeholder="Item" value="'+esc(x.n)+'" aria-label="Item"><input type="number" class="iq" inputmode="decimal" placeholder="Qty" value="'+esc(x.q||"")+'" aria-label="Quantity">'+
    '<select class="iu" aria-label="Unit">'+opt([["g","g"],["ml","ml"],["pc","pieces"],["bunch","bunch"],["pack","pack"]],x.u||"g")+'</select>'+
    '<select class="ic" aria-label="Where to buy">'+opt([["V","Bazaar veg"],["F","Fish/meat"],["E","Eggs"],["G","Online"],["P","Pantry"]],x.c)+'</select></div>';
}
function editSheet(d){
  sheetCtx={edit:d?d.id:null};
  d=d||{name:"",type:"fish",veg:false,ing:[null,null,null],note:""};
  openSheet('<h2>'+(sheetCtx.edit?"Edit dish":"Add my dish")+'</h2>'+
   '<label class="field"><span>Dish name</span><input type="text" id="dn" value="'+esc(d.name)+'"></label>'+
   '<label class="field"><span>Kind</span><select id="dt">'+Object.keys(TYPES).filter(t=>t!=="staple").map(t=>'<option value="'+t+'"'+(t===d.type?" selected":"")+'>'+TYPES[t]+'</option>').join("")+'</select></label>'+
   '<label class="row" style="margin-top:10px"><input type="checkbox" id="dv"'+(d.veg?" checked":"")+'> Vegetarian</label>'+
   '<div class="field"><span>Ingredients for 4 people</span><div id="ings">'+d.ing.map(ingRow).join("")+'</div><div><button class="btn plain small" data-act="ingadd">Add ingredient</button></div></div>'+
   '<label class="field"><span>Note for the cook</span><textarea id="dnote" rows="3">'+esc(d.note)+'</textarea></label>'+
   '<p class="hint" id="editMsg"></p><div class="row" style="margin-top:8px"><button class="btn" data-act="savedish">Save dish</button>'+(sheetCtx.edit?'<button class="btn ghost" data-act="deldish">Delete</button>':'')+'<button class="btn plain" data-act="close">Cancel</button></div>');
}
function viewSheet(id){
  const d=dish(id);if(!d)return;
  openSheet(dishInfo(d)+'<div class="row" style="margin-top:10px">'+(d.mine?'<button class="btn" data-act="edit" data-id="'+d.id+'">Edit</button>':'')+'<button class="btn plain" data-act="close">Close</button></div>');
}
function textSheet(text){
  openSheet('<h2>Copy this text</h2><p class="hint">Press and hold inside the box, select all, then copy.</p><textarea id="ta" rows="12" readonly>'+esc(text)+'</textarea><div class="row" style="margin-top:10px"><button class="btn plain" data-act="close">Close</button></div>');
  const ta=$("ta");ta.focus();ta.select();
}
function copy(text,btn){
  const ok=()=>{const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>{btn.textContent=o;},1400);};
  try{navigator.clipboard.writeText(text).then(ok).catch(()=>textSheet(text));}catch(e){textSheet(text);}
}
let armed=null;
function twoTap(btn,fn){
  if(armed===btn){armed=null;fn();return;}
  armed=btn;const o=btn.textContent;btn.textContent="Tap again to replace the menu";
  setTimeout(()=>{if(armed===btn){armed=null;if(btn.isConnected)btn.textContent=o;}},3000);
}

/* ---------- New ideas from Claude ---------- */
let sampleFn=null, lastWish="", ideaType="", freeIdeas=[];
function freePick(){
  const onMenu=new Set([].concat(...S.plan.map(d=>d.b.concat(d.l,d.d))));
  const notRecent=d=>!onMenu.has(d.id)&&!S.last.includes(d.id);
  let pool=allDishes().filter(d=>d.type!=="staple"&&!S.off.includes(d.id)&&(ideaType?d.type===ideaType:d.type!=="bf"));
  const fresh=pool.filter(notRecent);
  freeIdeas=shuffle(fresh.length>=3?fresh:pool).slice(0,5).map(d=>d.id);
}
function ideaListHtml(){
  return freeIdeas.map(id=>{const d=dish(id);if(!d)return "";
    return '<div class="lib"><button class="nm" data-act="view" data-id="'+d.id+'">'+esc(d.name)+' <span class="pill tag">'+TYPES[d.type]+'</span>'+(d.ai?' <span class="pill tag">new idea</span>':'')+'</button><button class="btn plain small" data-act="toMenu" data-id="'+d.id+'">Put on menu</button></div>';}).join("");
}
function toMenuSheet(id){
  const d=dish(id);if(!d)return;sheetCtx={id};
  const def=d.type==="bf"?["b"]:["l","d"];
  openSheet('<h2>'+esc(d.name)+'</h2><p class="hint">Pick a day and meal.</p>'+[0,1,2,3,4,5,6].map(i=>'<div class="lib"><span>'+label(i)+'</span><div class="chips">'+MEALS.filter(([m])=>def.includes(m)).map(([m,t])=>'<button class="tog" data-act="placeIt" data-i="'+i+'" data-m="'+m+'">'+t+'</button>').join("")+'</div></div>').join("")+'<div class="row" style="margin-top:10px"><button class="btn plain" data-act="close">Cancel</button></div>');
}
async function showIdeas(){
  try{
    if(sampleFn===null){sampleFn=(window.claude&&window.claude.use)?(await window.claude.use("sample"))||false:false;}
    if(sampleFn&&!aiReady()&&tab==="dishes"&&!$("ideasBtn"))render();
  }catch(e){sampleFn=false;}
}
function addIdeas(out){
  let n=0;
  (Array.isArray(out)?out:[]).forEach(o=>{
    if(!o||typeof o.name!=="string"||!TYPES[o.type]||o.type==="staple")return;
    if(allDishes().some(d=>d.name.toLowerCase()===o.name.toLowerCase()))return;
    const ing=(Array.isArray(o.ing)?o.ing:[]).filter(x=>x&&typeof x.n==="string").slice(0,10).map(x=>({n:x.n.slice(0,40),q:+x.q||0,u:["g","ml","pc","bunch","pack"].includes(x.u)?x.u:"g",c:WHERE[x.c]?x.c:"G"}));
    S.mine.push({id:"u"+Date.now().toString(36)+n,name:o.name.slice(0,60),type:o.type,veg:!!o.veg,ing,note:String(o.note||"").slice(0,300),mine:true,ai:true});n++;
  });
  return n;
}
async function ideas(btn){
  const msg=$("ideasMsg");const wEl=$("wish");lastWish=wEl?wEl.value.trim():"";
  if(aiReady()){
    btn.disabled=true;btn.textContent="Searching the web";
    try{
      const r=await fetch(AI.url.replace(/\/+$/,""),{method:"POST",headers:{"Content-Type":"application/json","x-rannaghar-token":AI.token},body:JSON.stringify({have:allDishes().map(d=>d.name),wish:lastWish,count:5})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(r.status===401?"The passcode does not match the one on your Worker.":(j.error||"The Worker answered with error "+r.status+"."));
      if(j.usd){const k=monthKey();AI.spend[k]=(AI.spend[k]||0)+j.usd;saveAI();}
      const before=S.mine.length;const n=addIdeas(j.dishes);
      if(n){freeIdeas=S.mine.slice(before).map(d=>d.id);save();render();$("ideasMsg").textContent=n+" new dishes found on the web and saved to your list. Cost about ₹"+((j.usd||0)*90).toFixed(2)+".";}
      else{msg.textContent="No usable ideas came back. Try again, or change what you typed.";btn.disabled=false;btn.textContent="Ideas through web";}
    }catch(e){
      msg.textContent=(e&&e.message&&!/fetch/i.test(e.message))?e.message:"Could not reach your Worker. Check the link in Menu, Settings.";
      btn.disabled=false;btn.textContent="Ideas through web";
    }
    return;
  }
  if(!sampleFn)return;
  btn.disabled=true;btn.textContent="Searching the web";
  const have=allDishes().map(d=>d.name).join("; ");
  const prompt="Suggest 5 home-style dishes for a Bengali family in Kolkata that are NOT already in this list: "+have+".\n"+
   "Mostly non-vegetarian Bengali food, with one or two home-made Chinese or vegetarian dishes. Every dish must be cooked with very little oil (no deep frying).\n"+(lastWish?"The family asked for: "+lastWish+"\n":"")+
   "Return ONLY a JSON array. Each element: {\"name\":string, \"type\":one of bf|dal|side|fish|chicken|egg|mutton|vegmain|cncarb|cnmain, \"veg\":boolean, "+
   "\"ing\":[{\"n\":ingredient name, \"q\":number for 4 people (0 for spices), \"u\":\"g\"|\"ml\"|\"pc\"|\"bunch\"|\"pack\", \"c\":\"F\" fish or meat|\"E\" eggs|\"V\" vegetables|\"G\" grocery|\"P\" spices and pantry}], "+
   "\"note\":one or two short sentences telling the cook how to make it with less oil}. Main ingredients only, at most 7 per dish.";
  try{
    let out=await sampleFn.json(prompt);
    if(out&&!Array.isArray(out)&&Array.isArray(out.dishes))out=out.dishes;
    const before=S.mine.length;const n=addIdeas(out);
    if(n){freeIdeas=S.mine.slice(before).map(d=>d.id);save();render();$("ideasMsg").textContent=n+" new dishes added. They are marked as new idea in the lists below.";}
    else{msg.textContent="No usable ideas came back. Try again in a minute.";btn.disabled=false;btn.textContent="Ideas through web";}
  }catch(e){
    if(e&&e.code==="not_granted"){btn.hidden=true;msg.textContent="New ideas are switched off for this page.";}
    else{msg.textContent="Could not get ideas just now. Try again in a minute.";btn.disabled=false;btn.textContent="Ideas through web";}
  }
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("nav button");
  if(tb){tab=tb.dataset.tab;$("main").scrollTop=0;render();return;}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i;
  if(a==="close")closeSheet();
  else if(a==="ppl"){S.people=Math.min(10,Math.max(1,S.people+(+b.dataset.n)));save();render();}
  else if(a==="tg"){const k=b.dataset.key,wd=+b.dataset.wd;S[k]=S[k].includes(wd)?S[k].filter(x=>x!==wd):S[k].concat(wd);save();b.setAttribute("aria-pressed",String(S[k].includes(wd)));}
  else if(a==="shuf")twoTap(b,()=>{genWeek();save();render();});
  else if(a==="next")twoTap(b,()=>{S.last=[].concat(...S.plan.map(d=>d.b.concat(d.l,d.d)));S.weekStart=iso(addDays(fromIso(S.weekStart),7));genWeek();save();render();});
  else if(a==="day"){regenDay(i);save();render();}
  else if(a==="chip")chipSheet(i,b.dataset.m,+b.dataset.k);
  else if(a==="add")addSheet(i,b.dataset.m);
  else if(a==="rm"&&sheetCtx){S.plan[sheetCtx.i][sheetCtx.m].splice(sheetCtx.k,1);save();closeSheet();render();}
  else if(a==="swap"&&sheetCtx){S.plan[sheetCtx.i][sheetCtx.m][sheetCtx.k]=b.dataset.id;save();closeSheet();render();}
  else if(a==="addpick"&&sheetCtx){S.plan[sheetCtx.i][sheetCtx.m].push(b.dataset.id);save();closeSheet();render();}
  else if(a==="cd"){cookDay=i;render();}
  else if(a==="copy"){const w=b.dataset.what;copy(w==="menu"?menuText():w==="cookday"?cookText(cookDay):w==="cookweek"?weekText():w==="bazaar"?bazaarText():onlineText(),b);}
  else if(a==="off"){const id=b.dataset.id;S.off=S.off.includes(id)?S.off.filter(x=>x!==id):S.off.concat(id);save();render();}
  else if(a==="view")viewSheet(b.dataset.id);
  else if(a==="new")editSheet(null);
  else if(a==="edit")editSheet(dish(b.dataset.id));
  else if(a==="ingadd")$("ings").insertAdjacentHTML("beforeend",ingRow());
  else if(a==="savedish"){
    const name=$("dn").value.trim();if(!name){$("editMsg").textContent="Give the dish a name first.";return;}
    const ing=[...document.querySelectorAll("#ings .ing")].map(r=>({n:r.querySelector(".in").value.trim(),q:+r.querySelector(".iq").value||0,u:r.querySelector(".iu").value,c:r.querySelector(".ic").value})).filter(x=>x.n);
    const d={id:sheetCtx.edit||"u"+Date.now().toString(36),name,type:$("dt").value,veg:$("dv").checked,ing,note:$("dnote").value.trim(),mine:true};
    const at=S.mine.findIndex(x=>x.id===d.id);if(at>=0)S.mine[at]=d;else S.mine.push(d);
    save();closeSheet();render();
  }
  else if(a==="deldish"&&sheetCtx){const id=sheetCtx.edit;S.mine=S.mine.filter(x=>x.id!==id);S.plan.forEach(d=>["b","l","d"].forEach(m=>{d[m]=d[m].filter(x=>x!==id);}));save();closeSheet();render();}
  else if(a==="ideas")ideas(b);
  else if(a==="free"){freePick();render();const m=$("ideasMsg");if(m)m.textContent=freeIdeas.length?"From your saved dishes. Tap Ideas again for others.":"No dishes of that kind are switched on.";}
  else if(a==="toMenu")toMenuSheet(b.dataset.id);
  else if(a==="placeIt"&&sheetCtx){S.plan[i][b.dataset.m].push(sheetCtx.id);save();closeSheet();const m=$("ideasMsg");render();const m2=$("ideasMsg");if(m2)m2.textContent="Added to "+label(i)+".";}
  else if(a==="backup"){try{const bl=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const u=URL.createObjectURL(bl);const l=document.createElement("a");l.href=u;l.download="rannaghar-backup-"+iso(new Date())+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);$("bkMsg").textContent="Backup saved to your Downloads.";}catch(err){textSheet(JSON.stringify(S));}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.ck){if(t.checked)S.ck[t.dataset.ck]=true;else delete S.ck[t.dataset.ck];save();render();}
  else if(t.id==="restore"&&t.files&&t.files[0]){t.files[0].text().then(tx=>{const o=JSON.parse(tx);if(!Array.isArray(o.plan)||o.plan.length!==7)throw 0;S=normalize(o);save();render();setOpen=true;}).catch(()=>{const m=$("bkMsg");if(m)m.textContent="That file is not a Rannaghar backup.";});}
  else if(t.id==="ideaType"){ideaType=t.value;}
  else if(t.id==="aiUrl"||t.id==="aiTok"){AI.url=$("aiUrl").value.trim();AI.token=$("aiTok").value.trim();saveAI();setOpen=true;render();}
  else if(t.id==="ws"&&t.value){S.weekStart=t.value;save();render();}
});
document.addEventListener("input",e=>{if(e.target.id==="q")$("pickList").innerHTML=pickList(e.target.value);});

load();
(function(){const t=iso(new Date());for(let i=0;i<7;i++)if(iso(dateOf(i))===t)cookDay=i;})();
render();
initRemote();
if(location.protocol==="https:"&&"serviceWorker" in navigator&&!window.claude){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
