<style>
/* Layout idea: phone app shell. Fixed header, scrolling day cards, bottom tab bar. */
:root{
  --bg:#f6ece0; --card:#fffaf2; --ink:#2b2118; --muted:#7a6a5a; --line:#e4d5c1;
  --accent:#b4532a; --accent-ink:#fff8f0; --soft:#f0e0cc;
  --veg:#3f7d4e; --veg-bg:#e2efdf; --cn:#8a5a12; --cn-bg:#f6e6c4;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1d1712; --card:#28201a; --ink:#f3e8da; --muted:#b3a290; --line:#3d3229;
    --accent:#e08a5c; --accent-ink:#22150d; --soft:#342a22;
    --veg:#8fcf9d; --veg-bg:#22362a; --cn:#e6c27a; --cn-bg:#3a2f18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1d1712; --card:#28201a; --ink:#f3e8da; --muted:#b3a290; --line:#3d3229;
  --accent:#e08a5c; --accent-ink:#22150d; --soft:#342a22;
  --veg:#8fcf9d; --veg-bg:#22362a; --cn:#e6c27a; --cn-bg:#3a2f18;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{padding:16px 18px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:0 0 20px 20px;box-shadow:0 4px 14px rgba(0,0,0,.12);position:relative;z-index:1}
h1{font-family:var(--display);font-weight:600;font-size:25px;margin:0;line-height:1.1;text-wrap:balance}
.sub{font-size:13px;margin-top:3px;opacity:.88}
.sync{font-size:11px;text-align:right;white-space:nowrap;opacity:.8}
main>*{flex-shrink:0}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px;zoom:var(--zoom,1)}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:5px 4px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.05)}
nav button{flex:1;min-width:0;background:none;border:0;padding:3px 0 2px;font-weight:600;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button svg{width:21px;height:21px;padding:4px 13px;box-sizing:content-box;border-radius:99px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--accent);font-weight:700}
nav button[aria-current="true"] svg{background:var(--soft)}
@media (max-width:380px){nav button svg{padding:4px 9px}nav button{font-size:10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 16px rgba(0,0,0,.04)}
.swatch{display:flex;align-items:center;gap:7px;background:none;border:1.5px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;font-size:13px;color:var(--ink)}
.swatch i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(128,128,128,.25)}
.swatch[aria-pressed="true"]{border-color:var(--accent);font-weight:700;background:var(--soft)}
.card.today{border-color:var(--accent)}
.card.ok{border-color:var(--veg);border-width:2px}
.status{border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13.5px;background:var(--soft)}
.status.err{background:#f9dcd2;color:#7a2410}
.card.today{box-shadow:0 0 0 1px var(--accent),0 6px 16px rgba(0,0,0,.05)}
.mealhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar i.over{background:#b3261e}
.tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);background:none;margin-right:8px;vertical-align:-5px;font-size:13px;font-weight:800;line-height:1;padding:0;color:var(--accent-ink)}
.tick[aria-pressed="true"]{background:var(--veg);border-color:var(--veg)}
.mini{background:none;border:0;color:var(--accent);font-weight:700;font-size:12.5px;padding:4px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.veg{background:var(--veg-bg);color:var(--veg)}
.pill.cn{background:var(--cn-bg);color:var(--cn)}
.pill.tag{background:var(--soft);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px;text-align:left}
.chip.add{background:none;border-style:dashed;color:var(--muted);padding:6px 11px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 10px;font-size:12px}
.btn.plain{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tog{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
details summary{cursor:pointer;font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700}
.stepper b{font-variant-numeric:tabular-nums;min-width:20px;text-align:center}
.dish{padding:8px 0;border-top:1px solid var(--line)}
.dish:first-of-type{border-top:0}
.dish b{font-weight:600}
.note{color:var(--muted);font-size:13.5px;margin-top:2px}
.use{font-size:12.5px;color:var(--muted);margin-top:2px;font-style:italic}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex:none}
.item label{flex:1;display:flex;justify-content:space-between;gap:10px}
.item .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item .d{display:block;font-size:12px;color:var(--muted)}
.item.done label{text-decoration:line-through;color:var(--muted)}
.lib{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lib:first-of-type{border-top:0}
.lib .nm{background:none;border:0;padding:0;text-align:left;flex:1}
.lib.off .nm{color:var(--muted);text-decoration:line-through}
.hint{font-size:12.5px;color:var(--muted)}
#sheet{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#sheet[hidden]{display:none}
#toast{position:fixed;left:16px;right:16px;bottom:70px;z-index:20;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;max-width:608px;margin:0 auto}
#toast[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,6,.5)}
.sheet-body{zoom:var(--zoom,1);position:relative;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:16px 16px 22px;max-height:86%;overflow-y:auto;max-width:640px;width:100%;margin:0 auto}
.pick{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.ing{display:grid;grid-template-columns:1fr 62px 74px 88px;gap:5px;margin-top:5px}
.ing input,.ing select{padding:7px 6px;font-size:13px}
@media (max-width:380px){.ing{grid-template-columns:1fr 54px 66px 80px}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tog{transition:background .15s}}
</style>
</head>
<body>

  <header>

<script>

   where: F fish and meat, E eggs, V vegetables (all bazaar); G grocery (online); P pantry, check stock */
const RAW = [

["s76","Ol dalna","side",1,"Ol (elephant yam):400g:V;Potato:1pc:V;Tomato:1pc:V","Boil ol cubes with a little tamarind so it does not itch, drain. Light cumin and ginger gravy with 2 tsp oil."],
["s77","Kanchkolar khosha bata","side",1,"Raw banana:3pc:V;Garlic bulb:1pc:V","Boil the banana peels, grind with garlic and green chilli. Cook the paste in 1 tsp mustard oil with kalonji till dry."],
["s78","Gathi kochu dalna","side",1,"Gathi kochu (arbi):400g:V;Tomato:1pc:V","Boil and peel the kochu. Light cumin and ginger gravy with 2 tsp oil. Do not fry."],
["s79","Borboti alu bhaja","side",1,"Borboti (long beans):300g:V;Potato:2pc:V","Cut small. Cook covered with kalonji in 2 tsp oil till soft, then open to dry."],
["s80","Stuffed karela on tawa","side",1,"Karela:4pc:V;Onion:2pc:V;Besan:30g:G","Slit and salt the karela 20 minutes, rinse. Fill with dry-roasted besan, onion and spices. Cook covered on tawa with 2 tsp oil, turning."],
["s81","Pui shaak chorchori","side",1,"Pui shaak:1bunch:V;Pumpkin:200g:V;Brinjal:1pc:V;Potato:1pc:V","Cut stems and leaves separately. Panch phoron in 2 tsp oil, vegetables and stems first, leaves later. Cook covered till dry."],
["s82","Notey shaak with garlic","side",1,"Notey shaak:2bunch:V;Garlic bulb:1pc:V","Wash very well, chop. Garlic and dry chilli in 1 tsp oil, add shaak, cook open till the water dries."],
["s83","Kolmi shaak bhaja","side",1,"Kolmi shaak:2bunch:V;Garlic bulb:1pc:V","Wash, chop. Kalonji and garlic in 1 tsp mustard oil. Cook open on high flame 5 minutes."],
["s84","Palong ghonto with bori","side",1,"Spinach (palong):2bunch:V;Pumpkin:150g:V;Brinjal:1pc:V;Bori:30g:G","Dry-roast the bori. Cook vegetables with panch phoron in 2 tsp oil, add spinach, then crushed bori at the end."],
["s85","Capsicum besan sabzi","side",1,"Capsicum:4pc:V;Besan:50g:G;Onion:1pc:V","Dry-roast the besan. Cook capsicum and onion in 2 tsp oil 5 minutes, sprinkle besan and spices, stir 3 minutes."],
["s86","Carrot cucumber curd salad","side",1,"Carrot:2pc:V;Cucumber:2pc:V;Curd:200g:G","Grate carrot, chop cucumber, mix with curd, roasted cumin and salt. No oil."],
["s87","Alu phulkopi posto","side",1,"Cauliflower:1pc:V;Potato:2pc:V;Posto (poppy seeds):40g:G","Steam cauliflower 5 minutes. Cook potato covered in 2 tsp mustard oil, add cauliflower and posto paste with green chilli."],
["s88","Sojne phul with alu","side",1,"Sojne phul:200g:V;Potato:2pc:V;Green peas:80g:V","Wash and blanch the flowers. Cook with cubed potato and peas, kalonji and 2 tsp oil. Spring season."],
["s89","Lau bori ghonto","side",1,"Lau (bottle gourd):500g:V;Bori:40g:G","Dry-roast bori. Cook lau in its own water with cumin and ginger, 1 tsp oil. Add bori, finish with a little milk."],
["s90","Kumro alu potol torkari","side",1,"Pumpkin:250g:V;Potato:1pc:V;Potol:4pc:V","Panch phoron in 2 tsp oil, all vegetables together, covered, with a splash of water. Good with ruti."],
["s91","Tomato begun torkari","side",1,"Brinjal:2pc:V;Tomato:3pc:V;Onion:1pc:V","Cook onion and tomato to a soft masala in 2 tsp oil, add brinjal cubes and cover till soft."],
["s92","Mushroom capsicum stir fry","side",1,"Mushroom:300g:V;Capsicum:2pc:V;Garlic bulb:1pc:V","High flame, 1 tsp oil. Mushroom first till the water dries, then capsicum and garlic for 2 minutes."],

["f51","Kochur loti with chingri","fish",0,"Kochur loti:400g:V;Small prawns:200g:F;Mustard seeds:20g:G","Boil loti with salt and turmeric, drain. Cook prawns 2 minutes in 2 tsp mustard oil, add loti, mustard paste and green chilli, cover 8 minutes."],
["f52","Pui shaak with macher matha","fish",0,"Pui shaak:1bunch:V;Fish head:1pc:F;Pumpkin:200g:V;Potato:1pc:V","Sear the fish head on a non-stick pan and break it up. Cook vegetables and pui stems with panch phoron in 2 tsp oil, add the head and leaves, cover till dry."],
["f53","Bandhakopi with macher matha","fish",0,"Cabbage:500g:V;Fish head:1pc:F;Potato:1pc:V;Green peas:80g:V","Sear and break the fish head. Cook shredded cabbage covered with potato in 2 tsp oil, add the head and peas, cook till dry."],
["f54","Topse tawa fry","fish",0,"Topse fish:500g:F;Besan:40g:G;Lemon:1pc:V","Marinate with lemon, turmeric and salt. Dust lightly with besan and rice flour. Cook on non-stick tawa with a brush of oil, not deep fried."],
["f55","Aar macher jhol","fish",0,"Aar fish:600g:F;Potato:2pc:V;Tomato:1pc:V","Sear the fish lightly. Thin jhol with cumin, ginger and tomato in 2 tsp oil. Add fish, simmer 8 minutes."],
["f56","Boal macher jhal","fish",0,"Boal fish:600g:F;Onion:1pc:V;Tomato:1pc:V","Sear lightly. Onion, garlic and tomato masala in 1 tbsp oil with red chilli. Simmer fish 8 minutes."],
["f57","Chitol muitha, steamed","fish",0,"Chitol fish:500g:F;Potato:2pc:V;Onion:2pc:V;Tomato:1pc:V","Scrape the flesh, mix with boiled potato and ginger, shape rolls and steam 10 minutes, then slice. Simmer in a light onion tomato gravy. No deep frying."],
["f58","Kajoli macher jhal","fish",0,"Kajoli fish:400g:F;Mustard seeds:20g:G","Do not fry, the fish is delicate. Kalonji and green chilli in 2 tsp mustard oil, thin mustard gravy, add fish, 5 minutes."],
["f59","Rui posto","fish",0,"Rohu (rui) fish:600g:F;Posto (poppy seeds):40g:G","Sear the fish lightly. Posto and green chilli paste gravy with kalonji in 2 tsp mustard oil. Simmer 6 minutes."],
["f60","Chingri dopeyaja, light","fish",0,"Prawns (chingri):500g:F;Onion:3pc:V;Tomato:1pc:V","Soften sliced onion slowly in 1 tbsp oil with splashes of water. Add tomato and spices, then prawns for 5 minutes only."],
["f61","Chingri pulao","fish",0,"Basmati rice:350g:G;Prawns (chingri):300g:F;Green peas:100g:V","Whole spices in 2 tsp ghee, add rice and water. Add prawns and peas when the rice is half done. Cover and finish on low flame."],
["f62","Magur macher jhol","fish",0,"Magur fish:500g:F;Raw banana:1pc:V;Potato:1pc:V","Light healing jhol. Sear the fish, simmer with raw banana, potato, cumin and ginger in 2 tsp oil."],
["f63","Shing macher jhol","fish",0,"Shing fish:400g:F;Raw papaya:200g:V;Potato:1pc:V","Thin jhol with papaya and potato, cumin and ginger, 2 tsp oil. Good when someone is recovering."],
["f64","Bhetki malaikari, light","fish",0,"Bhetki fish:500g:F;Coconut milk:200ml:G;Onion:1pc:V","Sear the fish lightly. Onion paste in 2 tsp oil, thin coconut milk, simmer fish 6 minutes."],
["f65","Kolkata fish fry, air fried","fish",0,"Bhetki fillet:500g:F;Eggs:1pc:E;Breadcrumbs:80g:G;Lemon:1pc:V","Marinate fillets in lemon, ginger, garlic, coriander and chilli paste 1 hour. Egg, crumb, then bake or air fry at 200°C 12 minutes. Serve with kasundi and salad."],
["f66","Fish fingers, baked","fish",0,"Bhetki fillet:400g:F;Eggs:1pc:E;Breadcrumbs:80g:G","Cut strips, marinate with lemon and pepper. Egg, crumb and bake 12 minutes, turning once."],
["f67","Rui macher tok","fish",0,"Rohu (rui) fish:400g:F;Raw mango:1pc:V","Sear small pieces. Mustard seeds in 1 tsp oil, raw mango or tamarind, water and a little sugar. Thin and sour, served last."],
["f68","Chingri diye potol","fish",0,"Small prawns:200g:F;Potol:8pc:V;Potato:1pc:V","Steam potol halfway. Light cumin gravy in 2 tsp oil, add prawns for the last 5 minutes."],
["f69","Chingri diye echor","fish",0,"Prawns (chingri):250g:F;Echor (raw jackfruit):500g:V;Potato:1pc:V","Pressure cook jackfruit 1 whistle. Onion and ginger masala in 1 tbsp oil, add jackfruit, then prawns for 5 minutes."],
["f70","Steamed pomfret with ginger","fish",0,"Pomfret:600g:F;Spring onion:1bunch:V;Lemon:1pc:V","Score the fish, rub with salt, ginger and lemon. Steam 12 minutes. Pour 1 tsp hot oil with garlic over it."],
["f71","Macher dimer bora, tawa","fish",0,"Fish roe:250g:F;Onion:1pc:V;Besan:30g:G","Mix roe with onion, chilli and besan. Small flat patties on non-stick tawa with a brush of oil, covered, then flip."],
["f72","Tangra with begun and bori","fish",0,"Tangra fish:500g:F;Brinjal:1pc:V;Bori:30g:G","Dry-roast bori. Sear fish lightly. Thin kalonji jhol with brinjal in 2 tsp oil, add fish and bori, 6 minutes."],

["c34","Kancha lonka murgi","chicken",0,"Chicken:700g:F;Onion:2pc:V;Curd:100g:G;Coriander leaves:1bunch:V","Marinate skinless chicken in curd, green chilli paste and ginger garlic. Cook covered in its own juices with 1 tbsp oil, no red chilli or turmeric. Coriander at the end."],
["c35","Gondhoraj chicken","chicken",0,"Chicken:700g:F;Curd:200g:G;Gondhoraj lemon:2pc:V","Marinate in curd, ginger, green chilli and lemon zest. Cook covered on low flame with 2 tsp oil. Squeeze gondhoraj juice and add leaves after turning off the flame."],
["c36","Chicken pulao","chicken",0,"Basmati rice:350g:G;Chicken:500g:F;Onion:1pc:V;Curd:100g:G","Brown onion in 2 tsp ghee with whole spices, cook chicken with curd 10 minutes, add rice and water, cover on low flame."],
["c37","Shorshe chicken","chicken",0,"Chicken:700g:F;Mustard seeds:30g:G;Curd:100g:G","Marinate skinless chicken in curd and mustard paste. Cook covered with green chilli in 1 tbsp mustard oil till tender."],
["c38","Butter chicken, light","chicken",0,"Boneless chicken:600g:F;Tomato:5pc:V;Curd:150g:G;Cashew:20g:G;Milk:100ml:G","Grill curd-marinated chicken on a tawa. Boil and blend tomato with cashew, simmer with 1 tsp butter, add milk instead of cream, then the chicken."],
["c39","Chicken tikka masala, light","chicken",0,"Boneless chicken:600g:F;Curd:200g:G;Onion:2pc:V;Tomato:3pc:V;Capsicum:1pc:V","Tawa-grill marinated chicken. Onion tomato masala in 1 tbsp oil, add chicken and capsicum, simmer 5 minutes."],
["c40","Chicken shami kebab, tawa","chicken",0,"Chicken keema:500g:F;Chana dal:80g:G;Onion:1pc:V","Pressure cook keema with soaked chana dal and whole spices till dry. Grind, shape patties and cook on non-stick tawa with a brush of oil."],
["c41","Chicken cutlet, baked","chicken",0,"Chicken keema:400g:F;Potato:2pc:V;Eggs:1pc:E;Breadcrumbs:60g:G","Cook keema dry, mix with boiled potato. Shape, egg and crumb, bake or air fry 15 minutes."],
["c42","Alu keema, chicken","chicken",0,"Chicken keema:500g:F;Potato:2pc:V;Onion:2pc:V;Tomato:1pc:V","Onion tomato masala in 2 tsp oil, add keema and cubed potato, cover and cook in its own juices."],
["c43","Chicken liver (mete) chorchori","chicken",0,"Chicken liver:400g:F;Onion:2pc:V;Potato:1pc:V","Wash well. Cook with sliced onion, potato and pepper in 2 tsp oil, covered, till dry."],
["c44","Kerala style chicken stew","chicken",0,"Chicken:600g:F;Potato:2pc:V;Carrot:1pc:V;Coconut milk:200ml:G;Onion:1pc:V","No frying. Simmer chicken with vegetables, whole spices, ginger and green chilli. Finish with thin coconut milk."],
["c45","Chicken with capsicum, home style","chicken",0,"Boneless chicken:600g:F;Capsicum:3pc:V;Onion:2pc:V;Tomato:1pc:V","Cook chicken with onion and tomato in 1 tbsp oil, add capsicum squares for the last 4 minutes so they stay crisp."],
["c46","Chicken khichuri","chicken",0,"Rice:200g:G;Moong dal:150g:G;Chicken:400g:F;Carrot:1pc:V","Dry-roast dal. Pressure cook rice, dal, small chicken pieces and carrot with ginger. 1 tbsp ghee. One-pot meal."],
["c47","Dhania chicken","chicken",0,"Chicken:700g:F;Coriander leaves:3bunch:V;Curd:150g:G;Onion:1pc:V","Blend coriander, green chilli and garlic. Marinate with curd. Cook covered with 1 tbsp oil till thick and green."],
["c48","Chettinad chicken, light","chicken",0,"Chicken:700g:F;Onion:2pc:V;Tomato:2pc:V;Coconut pieces:40g:V","Dry-roast pepper, fennel, coriander seeds and coconut, grind. Cook chicken with onion, tomato and the masala in 1 tbsp oil."],

["e17","Dim kosha, light","egg",0,"Eggs:6pc:E;Onion:3pc:V;Tomato:1pc:V","Do not fry the eggs. Brown onion slowly in 1 tbsp oil with splashes of water, add tomato and spices, then scored boiled eggs. Simmer till thick."],
["e18","Egg biryani, light","egg",0,"Basmati rice:350g:G;Eggs:6pc:E;Onion:2pc:V;Curd:100g:G","Half-cook rice with whole spices. Make egg masala with curd in 1 tbsp oil. Layer and steam on low flame 15 minutes."],
["e19","Mamlet jhol (omelette curry)","egg",0,"Eggs:5pc:E;Potato:2pc:V;Onion:1pc:V;Tomato:1pc:V","Make a thick omelette with a brush of oil, cut in squares. Thin potato jhol with cumin and ginger, add omelette pieces for 3 minutes."],
["e20","Dimer paturi","egg",0,"Eggs:6pc:E;Mustard seeds:30g:G;Coconut pieces:40g:V;Banana leaf:6pc:V","Halve boiled eggs, coat with mustard and coconut paste and green chilli. Wrap in banana leaf and steam 8 minutes."],
["e21","Egg malai curry, no cream","egg",0,"Eggs:6pc:E;Onion:1pc:V;Milk:200ml:G;Cashew:15g:G","Onion and cashew paste in 2 tsp oil, add milk and green chilli, simmer boiled eggs 5 minutes. White, mild gravy."],
["e22","Hansher dim kosha, light","egg",0,"Duck eggs:6pc:E;Onion:3pc:V;Potato:2pc:V","Boil duck eggs 12 minutes. Onion masala in 1 tbsp mustard oil, potatoes boiled not fried. Simmer till thick."],
["e23","Palak anda bhurji","egg",0,"Eggs:6pc:E;Spinach (palong):1bunch:V;Onion:1pc:V","Wilt chopped spinach with onion in 2 tsp oil, pour beaten eggs, stir till just set."],
["e24","Egg pulao","egg",0,"Basmati rice:350g:G;Eggs:5pc:E;Green peas:100g:V;Onion:1pc:V","Whole spices and onion in 2 tsp ghee, add rice, peas and water. Add halved boiled eggs when done."],
["e25","Egg tawa masala","egg",0,"Eggs:6pc:E;Onion:2pc:V;Tomato:2pc:V;Capsicum:1pc:V","Thick onion tomato masala on a tawa with 2 tsp oil. Halve boiled eggs, place cut side down, spoon masala over."],

["m12","Mutton keema ghugni","mutton",0,"Dried yellow peas:200g:G;Mutton keema:250g:F;Onion:2pc:V;Tomato:1pc:V","Soak peas overnight and pressure cook. Cook lean keema with onion and tomato in 2 tsp oil, add peas, simmer. Onion and lemon on top."],

["m14","Mutton yakhni pulao","mutton",0,"Basmati rice:350g:G;Mutton:500g:F;Onion:1pc:V","Trim fat. Pressure cook mutton with whole spices to make stock. Cook rice in the strained stock with the meat and 2 tsp ghee."],
["m15","Railway mutton curry, light","mutton",0,"Mutton:700g:F;Potato:3pc:V;Onion:2pc:V;Coconut milk:100ml:G","Trim fat. Pressure cook with onion, ginger garlic and mild spices in 1 tbsp oil. Add potatoes and a little thin coconut milk."],
["m16","Mutton rezala, light","mutton",0,"Mutton:700g:F;Curd:250g:G;Onion:2pc:V;Cashew:20g:G","Trim fat. Marinate in curd, onion paste and cashew. Pressure cook with whole spices in 1 tbsp ghee. White gravy, skim before serving."],
["m17","Mutton with shalgam or mulo","mutton",0,"Mutton:600g:F;Mooli:2pc:V;Onion:2pc:V","Trim fat. Pressure cook mutton with onion masala in 1 tbsp oil, add mooli pieces and cook 1 more whistle. Winter dish."],
["m18","Mutton liver curry","mutton",0,"Mutton liver:400g:F;Onion:2pc:V;Potato:2pc:V","Wash well. Cook with onion, ginger garlic and pepper in 1 tbsp oil, covered, 20 minutes with potato."],

["v34","Paneer butter masala, light","vegmain",1,"Paneer:300g:G;Tomato:5pc:V;Cashew:20g:G;Milk:100ml:G","Boil and blend tomato with cashew. Simmer with 1 tsp butter and kasuri methi, add milk instead of cream, then raw paneer cubes."],
["v35","Kadhai paneer, light","vegmain",1,"Paneer:300g:G;Capsicum:2pc:V;Onion:2pc:V;Tomato:3pc:V","Dry-roast and crush coriander seeds and red chilli. Onion tomato masala in 2 tsp oil, add capsicum and raw paneer."],
["v36","Palak chole","vegmain",1,"Kabuli chana:200g:G;Spinach (palong):2bunch:V;Onion:1pc:V;Tomato:2pc:V","Soak chana overnight, pressure cook. Blanch and blend spinach. Onion tomato masala in 2 tsp oil, add chana and spinach, simmer 10 minutes."],
["v37","Lau kofta curry, steamed","vegmain",1,"Lau (bottle gourd):500g:V;Besan:80g:G;Tomato:3pc:V;Onion:1pc:V","Grate lau, squeeze, mix with besan and spices. Steam the koftas 10 minutes instead of frying. Simmer 3 minutes in a light tomato gravy."],
["v38","Chanar paturi","vegmain",1,"Paneer:300g:G;Mustard seeds:30g:G;Coconut pieces:40g:V;Banana leaf:6pc:V","Mash paneer lightly, mix with mustard and coconut paste and green chilli. Wrap in banana leaf, steam 10 minutes."],
["v39","Bhoger khichuri","vegmain",1,"Gobindobhog rice:250g:G;Moong dal:200g:G;Cauliflower:1pc:V;Potato:2pc:V;Green peas:100g:V","Dry-roast dal till golden. Cook with rice, steamed cauliflower and potato, ginger, cumin and bay leaf. 1 tbsp ghee in total. Serve with tomato chutney."],
["v40","Vegetable biryani, light","vegmain",1,"Basmati rice:350g:G;Cauliflower:1pc:V;Carrot:2pc:V;Beans:100g:V;Curd:150g:G","Cook vegetables with curd and biryani masala in 1 tbsp oil. Layer with half-cooked rice, steam 15 minutes. Raita on the side."],
["v41","Kala chana curry","vegmain",1,"Kala chana:200g:G;Onion:2pc:V;Tomato:2pc:V","Soak overnight, pressure cook 5 whistles. Onion tomato masala in 2 tsp oil, simmer with the chana and its water."],
["v42","Sprouted moong curry","vegmain",1,"Moong sprouts:300g:V;Onion:1pc:V;Tomato:2pc:V;Coconut pieces:30g:V","Onion tomato masala in 2 tsp oil, add sprouts and water, cook 10 minutes. Coconut at the end."],
["v43","Tofu matar","vegmain",1,"Tofu:300g:G;Green peas:200g:V;Tomato:3pc:V;Onion:1pc:V","Pan-sear tofu cubes with a brush of oil. Tomato onion gravy in 2 tsp oil, add peas and tofu."],
["v44","Potoler dolma with paneer, baked","vegmain",1,"Potol:10pc:V;Paneer:200g:G;Onion:1pc:V;Tomato:2pc:V","Scoop out potol, steam 4 minutes. Fill with spiced paneer. Bake or cook covered on tawa with 1 tsp oil, then simmer in a light gravy."],

["v47","Paneer korma, light","vegmain",1,"Paneer:300g:G;Curd:150g:G;Onion:1pc:V;Cashew:20g:G","Boiled onion and cashew paste, whisked curd, whole spices in 2 tsp oil. Add raw paneer, simmer 4 minutes."],
["v48","Echor biryani, light","vegmain",1,"Basmati rice:350g:G;Echor (raw jackfruit):500g:V;Curd:150g:G;Onion:2pc:V","Pressure cook jackfruit 1 whistle. Cook with curd and biryani masala in 1 tbsp oil, layer with rice and steam."],

["n22","Chilli garlic noodles","cncarb",1,"Hakka noodles:400g:G;Garlic bulb:2pc:V;Spring onion:1bunch:V;Capsicum:1pc:V;Soy sauce::P","Brown chopped garlic and dry chilli in 1 tbsp oil, toss boiled noodles with soy and spring onion."],
["n23","Mushroom fried rice","cncarb",1,"Basmati rice:400g:G;Mushroom:250g:V;Spring onion:1bunch:V;Garlic bulb:1pc:V;Soy sauce::P","Cook rice ahead and cool. Mushroom and garlic on high flame in 1 tbsp oil, add rice and soy."],
["n24","Paneer fried rice","cncarb",1,"Basmati rice:400g:G;Paneer:200g:G;Carrot:1pc:V;Beans:100g:V;Soy sauce::P","Cold rice. Stir fry vegetables in 1 tbsp oil, add rice, soy and small raw paneer cubes at the end."],
["n25","Chicken chop suey, home style","cncarb",0,"Hakka noodles:300g:G;Boneless chicken:300g:F;Cabbage:200g:V;Carrot:1pc:V;Capsicum:1pc:V;Cornflour:20g:G","Boiled noodles, not fried. Chicken and vegetables in a light soy and tomato gravy thickened with cornflour, poured over the noodles."],
["n26","Prawn hakka noodles","cncarb",0,"Hakka noodles:400g:G;Prawns (chingri):300g:F;Cabbage:200g:V;Spring onion:1bunch:V;Soy sauce::P","Toss prawns 2 minutes in 1 tbsp oil, add vegetables and boiled noodles on high flame."],

["n28","Chicken congee (rice porridge)","cncarb",0,"Rice:200g:G;Chicken:300g:F;Spring onion:1bunch:V","Boil rice with lots of water, chicken and ginger for 40 minutes till creamy. Shred chicken. No oil. Light dinner."],
["n29","Corn and vegetable fried rice","cncarb",1,"Basmati rice:400g:G;Sweet corn:200g:V;Carrot:1pc:V;Beans:100g:V;Spring onion:1bunch:V;Soy sauce::P","Cold rice, high flame, 1 tbsp oil."],

function fmt(q,u){

    let r=q>=200?Math.round(q/50)*50:Math.max(10,Math.round(q/10)*10);

    return r+" "+u;

  const n=Math.max(1,Math.ceil(q-1e-9));
  if(u==="pc"||!u)return String(n);
  return n+" "+(n>1?(u==="bunch"?"bunches":u+"s"):u);
}

function estOwn(name){
  const ws=String(name).toLowerCase().split(/[^a-z]+/).filter(w=>w.length>2&&!["with","and","the","light","style","home"].includes(w));
  let best=[];let top=0;
  allDishes().forEach(d=>{if(d.type==="own")return;const nm=d.name.toLowerCase();const sc=ws.filter(w=>nm.includes(w)).length;if(!sc)return;if(sc>top){top=sc;best=[d];}else if(sc===top)best.push(d);});
  if(!best.length)return {k:250,p:8,veg:!/(egg|dim|chicken|murgi|fish|mach|maach|mutton|prawn|chingri|keema)/.test(String(name).toLowerCase()),from:""};
  best=best.slice(0,10);
  return {k:Math.round(best.reduce((a,d)=>a+kcal(d),0)/best.length/5)*5,p:Math.round(best.reduce((a,d)=>a+prot(d),0)/best.length),veg:best.filter(d=>d.veg).length>=best.length/2,from:best.slice(0,2).map(d=>d.name).join(", ")};
}

  return String(text||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{const mm=x.match(/^(.*?)\s+([\d.]+)\s*(g|gm|kg|ml|l|pc|pcs|piece|pieces|bunch|pack)?$/i);
    if(!mm)return {n:x.slice(0,40),q:0,u:"g",c:guessWhere(x)};let q=+mm[2],u=(mm[3]||"pc").toLowerCase();if(u==="kg"){q*=1000;u="g";}if(u==="l"){q*=1000;u="ml";}if(u==="gm")u="g";if(/^(pcs|piece|pieces)$/.test(u))u="pc";
    return {n:mm[1].slice(0,40),q:for4?q:q*4/Math.max(1,S.people),u,c:guessWhere(mm[1])};});
}

function applyOvr(){

    if(!d._orig){d._orig={};OVF.forEach(f=>{d._orig[f]=d[f];});}
    OVF.forEach(f=>{if(S.ovr[id][f]!==undefined)d[f]=S.ovr[id][f];});}

function resetOvr(id){const d=BUILTIN.find(x=>x.id===id);if(d&&d._orig)OVF.forEach(f=>{if(d._orig[f]===undefined)delete d[f];else d[f]=d._orig[f];});delete S.ovr[id];}

function weekLog(){
  const out=[];for(let i=0;i<7;i++){const E=effEat(i);const pl={};MK.forEach(m=>S.plan[i][m].forEach(id=>{pl[m+"|"+id]=1;}));
    for(const k in E){const p=k.split("|");const d=dish(p[2]);if(!d||!E[k])continue;out.push({i,m:p[1],d,q:E[k],k:E[k]*kcal(d),planned:!!pl[p[1]+"|"+p[2]]});}
    (S.extra[i]||[]).forEach(e=>out.push({i,m:"x",d:{name:e.n,type:"snack"},q:1,k:+e.k||0,planned:false}));}
  return out;
}

function wtChart(){
  const pts=(S.hist||[]).filter(x=>x.wt).map(x=>({l:x.ws,w:+x.wt})).reverse();if(S.wt)pts.push({l:S.weekStart,w:+S.wt});

  const W=320,H=140,P=28,t=+S.twt,vals=pts.map(p=>p.w).concat(t?[t]:[]),lo=Math.min(...vals)-0.5,hi=Math.max(...vals)+0.5;
  const X=i=>P+(W-P-10)*i/(pts.length-1),Y=v=>10+(H-30)*(hi-v)/(hi-lo);
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Weight by week">';
  [hi,lo].forEach(v=>{g+='<text x="0" y="'+(Y(v)+4)+'" font-size="9" fill="var(--muted)">'+v.toFixed(1)+'</text>';});
  if(t)g+='<line x1="'+P+'" x2="'+W+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--veg)" stroke-dasharray="4 3"/><text x="'+W+'" y="'+(Y(t)-3)+'" font-size="9" text-anchor="end" fill="var(--veg)">target '+t+'</text>';
  g+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+pts.map((p,i)=>X(i)+','+Y(p.w)).join(" ")+'"/>';

const TYPEMAP={breakfast:"bf",bf:"bf",dal:"dal",lentil:"dal",lentils:"dal",side:"side",veg:"side",vegetable:"side",sabzi:"side",fish:"fish",prawn:"fish",seafood:"fish",chicken:"chicken",egg:"egg",eggs:"egg",mutton:"mutton",goat:"mutton",lamb:"mutton",vegmain:"vegmain",paneer:"vegmain",cncarb:"cncarb",noodles:"cncarb",rice:"cncarb",cnmain:"cnmain",chinese:"cnmain",soup:"cnmain"};
function normType(o){
  const raw=String(o.type||"").toLowerCase();
  if(TYPES[raw]&&raw!=="staple")return raw;
  for(const k in TYPEMAP)if(raw.includes(k))return TYPEMAP[k];

  if(/chicken|murgi/.test(txt))return "chicken";
  if(/mutton|pathar|keema/.test(txt))return "mutton";
  if(/\begg|dim\b|dimer/.test(txt))return "egg";
  if(/dal\b|daal/.test(txt))return "dal";

}
let WHEREMAP=null;
function guessWhere(n){

  const k=ingKey(n);if(WHEREMAP[k])return WHEREMAP[k];
  for(const key in WHEREMAP)if(key.length>3&&(k.includes(key)||key.includes(k)))return WHEREMAP[key];
  if(/fish|prawn|chingri|chicken|mutton|maach|keema/i.test(n))return "F";
  if(/\begg/i.test(n))return "E";
  if(/dal|rice|flour|atta|oil|sauce|powder|seeds|masala|paneer|curd|milk|noodle|besan|suji|poha|chire/i.test(n))return "G";

function normIng(list){
  return (Array.isArray(list)?list:[]).map(x=>{
    if(typeof x==="string")return {n:x.slice(0,40),q:0,u:"g",c:"G"};
    if(!x)return null;
    const n=String(x.n||x.name||x.item||"").slice(0,40);if(!n)return null;
    let q=x.q!=null?x.q:x.qty!=null?x.qty:x.quantity;let u=x.u||x.unit||"";
    if(typeof q==="string"){const m=q.match(/([\d.]+)\s*([a-z]*)/i);if(m){q=+m[1];if(!u)u=m[2];}else q=0;}

    const c=String(x.c||x.where||"").toUpperCase();

function findDishes(text){

  const fence=text.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence)tries.push(fence[1]);
  for(const t of tries){try{const v=JSON.parse(t.trim());if(Array.isArray(v))return v;}catch(e){}}
  const end=text.lastIndexOf("]");if(end<0)return [];
  for(let i=text.lastIndexOf("[",end);i>=0;i=text.lastIndexOf("[",i-1)){

}
let IDSEQ=0;
function addIdeas(out,forceMeal,keepK){

    const old=allDishes().find(d=>d.name.toLowerCase()===o.name.toLowerCase());
    if(old){ids.push(old.id);return;}
    const ing=normIng(o.ing||o.ingredients);

    const d={id:"u"+Date.now().toString(36)+"x"+(IDSEQ++),name:o.name.trim().slice(0,60),type:o.type,veg:!!o.veg,ing,note:String(o.note||o.instructions||o.tip||"").slice(0,300),mine:true,ai:true};

/* Ask Claude. opts: {meal:"any"|"breakfast"|"lunch"|"dinner", veg:"both"|"veg"|"non", count, wish} */
async function askClaude(opts){

    let r,j;
    try{
      r=await fetch(AI.url.replace(/\/+$/,""),{method:"POST",headers:{"Content-Type":"application/json","x-rannaghar-token":AI.token},
        body:JSON.stringify({have,diet:opts.diet||undefined,search:!!AI.web&&!opts.diet,meal:opts.meal,veg:opts.veg,count:opts.count,wish:[opts.wish,opts.meal!=="any"?"All for "+opts.meal+".":"",opts.veg==="veg"?"Vegetarian only.":opts.veg==="non"?"Non-vegetarian only.":"Half veg, half non-veg.","For each dish add a field meal: breakfast, lunch or dinner."].filter(Boolean).join(" ")})});
    }catch(e){return {error:"Could not reach your Worker. Check the Worker link in the Settings tab, and that you are online."};}
    j=await r.json().catch(()=>({}));
    if(r.status===401)return {error:"The passcode in Settings does not match APP_TOKEN on your Worker."};
    if(!r.ok)return {error:(j.error||"The Worker answered with error "+r.status)+"."};
    if(j.usd){const k=monthKey();AI.spend[k]=(AI.spend[k]||0)+j.usd;}
    const entry={t:Date.now(),what:opts.label||"Claude ideas",usd:j.usd||0,tin:j.tin||0,tout:j.tout||0,s:j.searches||0,n:0};
    AI.log=(AI.log||[]);AI.log.unshift(entry);AI.log=AI.log.slice(0,200);saveAI();
    let list=Array.isArray(j.dishes)?j.dishes.filter(o=>o&&o.name):[];
    if(!list.length)list=findDishes(j.text);
    if(!list.length&&j.text)list=salvage(j.text);
    const ids=addIdeas(list,forceMeal,!!opts.diet);
    entry.n=ids.length;saveAI();
    if(!ids.length){
      const why=j.stop==="max_tokens"?" Claude's answer was cut off.":list.length?" Claude sent "+list.length+" items in an unexpected shape.":"";
      return {error:"Claude answered but no dishes could be read."+why+(j.version>=4?"":" Your Worker is an old version: update it from GitHub.")+(j.text?" Claude said: "+String(j.text).replace(/\s+/g," ").slice(0,200):"")+" Please try once more.",usd:j.usd};
    }
    save();return {ids,usd:j.usd||0,searched:j.searched,old:!(j.version>=3),ver:j.version||0};
  }
  if(sampleFn){
    const prompt="Suggest "+opts.count+" home-style low-oil dishes for a Bengali family in Kolkata, not in this list: "+have.join("; ")+". "+(opts.wish||"")+
      (opts.meal!=="any"?" All for "+opts.meal+".":" Spread across breakfast, lunch and dinner.")+(opts.veg==="veg"?" Vegetarian only.":opts.veg==="non"?" Non-vegetarian only.":" Half veg, half non-veg.")+
      (opts.diet?" Add k (kcal per serving) and pr (protein grams per serving) to each.":"")+" Return ONLY a JSON array of {name, meal:breakfast|lunch|dinner, type: bf|dal|side|fish|chicken|egg|mutton|vegmain|cncarb|cnmain, veg:boolean, ing:[{n,q (for 4 people),u:g|ml|pc|bunch|pack,c:F|E|V|G|P}], note}.";
    try{let out=await sampleFn.json(prompt);if(out&&!Array.isArray(out)&&Array.isArray(out.dishes))out=out.dishes;const ids=addIdeas(out,forceMeal,!!opts.diet);if(!ids.length)return {error:"No usable ideas came back. Try again."};save();return {ids,usd:0,ver:99};}
    catch(e){return {error:"Could not get ideas just now. Try again in a minute."};}
  }

  else if(e.target.id==="qN"&&QO&&!QO.edit&&!QO.touched){const g=estOwn(e.target.value);$("qK").value=g.k;$("qP").value=g.p;QO.veg=g.veg;document.querySelectorAll('[data-act="qVeg"]').forEach(x=>x.setAttribute("aria-pressed",String((x.dataset.v==="1")===g.veg)));}
  else if((e.target.id==="qK"||e.target.id==="qP")&&QO)QO.touched=true;
  else if(e.target.id==="eatQ"){const q=e.target.value.trim().toLowerCase();const el=$("eatList");if(!q){el.innerHTML="";return;}
    const hits=allDishes().filter(d=>d.name.toLowerCase().includes(q)).sort((a,b)=>(a.type==="snack"?0:1)-(b.type==="snack"?0:1)).slice(0,25);
    el.innerHTML=hits.map(d=>'<div class="lib"><span>'+esc(d.name)+' <span class="kc">'+kcal(d)+' kcal</span></span><button class="btn plain small" data-act="eatPick" data-id="'+d.id+'">Add</button></div>').join("")+ownBtn(e.target.value,"cal");}
  else if(e.target.id==="dq"){dishQ=e.target.value.trim();$("dlist").innerHTML=dishListHtml();}
  else if(e.target.id==="slotQ"){const q=e.target.value.trim().toLowerCase();const el=$("slotList");if(!el)return;if(!q){el.innerHTML="";return;}
    el.innerHTML=allDishes().filter(x=>x.type!=="staple"&&(x.name.toLowerCase().includes(q)||TYPES[x.type].toLowerCase().includes(q)||x.ing.some(y=>y.n.toLowerCase().includes(q)))).slice(0,30).map(x=>'<div class="lib"><span>'+esc(x.name)+' <span class="pill tag">'+esc(TYPES[x.type])+'</span></span><button class="btn plain small" data-act="slotAdd" data-id="'+x.id+'">Add</button></div>').join("")+ownBtn(e.target.value,"slot");}
  else if(e.target.id==="lq"&&listDraft){listDraft.q=e.target.value.trim();$("lrows").innerHTML=listRows();}
  else if(e.target.id==="swapQ"){const q=e.target.value.trim().toLowerCase();if(!q)return;
    $("swapList").innerHTML=allDishes().filter(x=>x.type!=="staple"&&(x.name.toLowerCase().includes(q)||TYPES[x.type].toLowerCase().includes(q)||x.ing.some(y=>y.n.toLowerCase().includes(q)))).slice(0,40).map(twoBtnRow).join("")+ownBtn(e.target.value,"swap");}
});

document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!e.target.dataset)return;const t=e.target;let q=null;
  if(t.id==="sxN"||t.id==="sxQ")q='[data-act="sxAdd"]';
  else if(t.dataset.cxt||t.dataset.cxq)q='[data-act="cxAdd"][data-id="'+(t.dataset.cxt||t.dataset.cxq)+'"]';
  else if(t.id==="exN"||t.id==="exK")q='[data-act="exAdd"]';
  if(q){e.preventDefault();const b=document.querySelector(q);if(b)b.click();}
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden||!S||S._tl||!$("sheet").hidden||!weekEnded())return;
  if(rollover()){shopV=[];cookVs=[];calDay=-1;menuScrolled=false;save();render();toast("A new week has started. Last week is saved under Calories, Earlier weeks.");}
});
load();
(function(){const t=iso(new Date());for(let i=0;i<7;i++)if(iso(dateOf(i))===t)cookDay=i;})();
render();
initRemote();
if(location.protocol==="https:"&&"serviceWorker" in navigator&&!window.claude){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
