<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rannaghar Weekly Menu</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b4532a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone app shell. Fixed header, scrolling day cards, bottom tab bar. */
:root{
  --bg:#f6ece0; --card:#fffaf2; --ink:#2b2118; --muted:#7a6a5a; --line:#e4d5c1;
  --accent:#b4532a; --accent-ink:#fff8f0; --soft:#f0e0cc;
  --veg:#3f7d4e; --veg-bg:#e2efdf; --cn:#8a5a12; --cn-bg:#f6e6c4;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1d1712; --card:#28201a; --ink:#f3e8da; --muted:#b3a290; --line:#3d3229;
    --accent:#e08a5c; --accent-ink:#22150d; --soft:#342a22;
    --veg:#8fcf9d; --veg-bg:#22362a; --cn:#e6c27a; --cn-bg:#3a2f18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1d1712; --card:#28201a; --ink:#f3e8da; --muted:#b3a290; --line:#3d3229;
  --accent:#e08a5c; --accent-ink:#22150d; --soft:#342a22;
  --veg:#8fcf9d; --veg-bg:#22362a; --cn:#e6c27a; --cn-bg:#3a2f18;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{padding:14px 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.sync{color:var(--muted);font-size:11px;text-align:right;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;border:0;padding:11px 2px 12px;font-weight:600;font-size:12.5px;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card.today{border-color:var(--accent)}
.card.ok{border-color:var(--veg);border-width:2px}
.status{border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13.5px;background:var(--soft)}
.status.err{background:#f9dcd2;color:#7a2410}
.mealhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mini{background:none;border:0;color:var(--accent);font-weight:700;font-size:12.5px;padding:4px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.veg{background:var(--veg-bg);color:var(--veg)}
.pill.cn{background:var(--cn-bg);color:var(--cn)}
.pill.tag{background:var(--soft);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;text-align:left}
.chip.add{background:none;border-style:dashed;color:var(--muted);padding:6px 11px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 10px;font-size:12px}
.btn.plain{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tog{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
details summary{cursor:pointer;font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700}
.stepper b{font-variant-numeric:tabular-nums;min-width:20px;text-align:center}
.dish{padding:8px 0;border-top:1px solid var(--line)}
.dish:first-of-type{border-top:0}
.dish b{font-weight:600}
.note{color:var(--muted);font-size:13.5px;margin-top:2px}
.use{font-size:12.5px;color:var(--muted);margin-top:2px;font-style:italic}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent);flex:none}
.item label{flex:1;display:flex;justify-content:space-between;gap:10px}
.item .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item .d{display:block;font-size:12px;color:var(--muted)}
.item.done label{text-decoration:line-through;color:var(--muted)}
.lib{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lib:first-of-type{border-top:0}
.lib .nm{background:none;border:0;padding:0;text-align:left;flex:1}
.lib.off .nm{color:var(--muted);text-decoration:line-through}
.hint{font-size:12.5px;color:var(--muted)}
#sheet{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#sheet[hidden]{display:none}
#toast{position:fixed;left:16px;right:16px;bottom:70px;z-index:20;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;max-width:608px;margin:0 auto}
#toast[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,6,.5)}
.sheet-body{position:relative;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px 22px;max-height:86%;overflow-y:auto;max-width:640px;width:100%;margin:0 auto}
.pick{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.ing{display:grid;grid-template-columns:1fr 62px 74px 88px;gap:5px;margin-top:5px}
.ing input,.ing select{padding:7px 6px;font-size:13px}
@media (max-width:380px){.ing{grid-template-columns:1fr 54px 66px 80px}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tog{transition:background .15s}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Rannaghar</h1><div class="sub" id="weekLabel"></div></div>
    <div class="sync" id="sync">Saved on this phone</div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="week">Menu</button>
    <button data-tab="cook">Cook</button>
    <button data-tab="shop">Shop</button>
    <button data-tab="ideas">Ideas</button>
    <button data-tab="dishes">Dishes</button>
    <button data-tab="settings">Settings</button>
  </nav>
</div>
<div id="toast" role="status" hidden></div>
<div id="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-body" id="sheetBody"></div></div>

  const starts=[];

  day.l.push("st1");push(day.l,pick("dal",true,used));for(let k=0;k<vn;k++)push(day.l,pick("side",true,used));push(day.l,pick(lType,veg,used));
  if(cn){push(day.d,pick("cncarb",veg,used));push(day.d,pick("cnmain",veg,used));if(vn>1&&!veg)push(day.d,pick("cnmain",true,used));}
  else{

    day.d.push("st2");for(let k=0;k<vn;k++)push(day.d,pick("side",true,used));push(day.d,pick(dType,veg,used));
  }

}
function genWeek(){
  const used=new Set();
  let lb=shuffle(["fish","fish","fish","fish","chicken","egg","fish"]);
  let db=shuffle(["chicken","chicken","chicken","egg","egg","fish","chicken"]);
  const L=activeList();
  if(L){
    const w={};L.ids.forEach(id=>{const d=dish(id);if(d&&["fish","chicken","egg","mutton"].includes(d.type))w[d.type]=(w[d.type]||0)+1;});
    const ks=Object.keys(w);
    if(ks.length){const tot=ks.reduce((x,k)=>x+w[k],0);
      const draw=()=>{let r=Math.random()*tot;for(const k of ks){r-=w[k];if(r<0)return k;}return ks[0];};
      lb=[0,1,2,3,4,5,6].map(draw);db=[0,1,2,3,4,5,6].map(draw);}
  }
  S.plan=[];for(let i=0;i<7;i++)S.plan.push(genDay(i,used,lb[i],db[i]));
  S.ck={};S.okv={};
}
function regenDay(i){
  const used=new Set();S.plan.forEach((d,j)=>{if(j!==i)["b","l","d"].forEach(m=>d[m].forEach(x=>used.add(x)));});
  const lt=["fish","fish","chicken","egg"][Math.floor(Math.random()*4)], dt=["chicken","chicken","egg","fish"][Math.floor(Math.random()*4)];

}

function fmt(q,u){
  if(u==="g"||u==="ml"){
    let r=q>=200?Math.round(q/50)*50:Math.max(10,Math.round(q/10)*10);
    if(r>=1000)return (Math.round(r/100)/10)+(u==="g"?" kg":" L");
    return r+" "+u;
  }
  const n=Math.max(1,Math.ceil(q-1e-9));
  if(u==="pc"||!u)return String(n);
  return n+" "+(n>1?(u==="bunch"?"bunches":u+"s"):u);
}
function scale(){return S.people/4;}
function useLine(d){return d.ing.filter(x=>x.q).map(x=>x.n+" "+fmt(x.q*scale(),x.u)).join(", ");}
function shopping(only){
  const items={},pantry=new Set(PANTRY);
  okVisits().filter(v=>!only||v.id===only).forEach(v=>v.slots.forEach(([i,m])=>S.plan[i][m].forEach(id=>{
    const d=dish(id);if(!d)return;
    d.ing.forEach(x=>{
      if(x.c==="P"||!x.q){pantry.add(x.n);return;}
      const k=x.n+"|"+x.u;const it=items[k]||(items[k]={k,n:x.n,u:x.u,c:x.c,q:0,days:[]});
      it.q+=x.q*scale();if(!it.days.includes(v.short))it.days.push(v.short);
    });
  })));
  const list=Object.values(items).sort((a,b)=>a.n.localeCompare(b.n));
  return {F:list.filter(x=>x.c==="F"),E:list.filter(x=>x.c==="E"),V:list.filter(x=>x.c==="V"),G:list.filter(x=>x.c==="G"),P:[...pantry]};
}

function salvage(text){
  /* pull out every complete {...} object, even if the list was cut off */
  const out=[];let depth=0,start=-1,inStr=false,esc2=false;
  const t=String(text||"");const from=Math.max(0,t.search(/<dishes>|\[\s*\{/));
  for(let i=from;i<t.length;i++){const c=t[i];
    if(inStr){if(esc2)esc2=false;else if(c==="\\")esc2=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==="{"){if(depth===0)start=i;depth++;}
    else if(c==="}"&&depth>0){depth--;if(depth===0&&start>=0){try{const o=JSON.parse(t.slice(start,i+1));if(o&&o.name)out.push(o);}catch(e){}start=-1;}}
  }
  return out;
}
const TYPEMAP={breakfast:"bf",bf:"bf",dal:"dal",lentil:"dal",lentils:"dal",side:"side",veg:"side",vegetable:"side",sabzi:"side",fish:"fish",prawn:"fish",seafood:"fish",chicken:"chicken",egg:"egg",eggs:"egg",mutton:"mutton",goat:"mutton",lamb:"mutton",vegmain:"vegmain",paneer:"vegmain",cncarb:"cncarb",noodles:"cncarb",rice:"cncarb",cnmain:"cnmain",chinese:"cnmain",soup:"cnmain"};
function normType(o){
  const raw=String(o.type||"").toLowerCase();
  if(TYPES[raw]&&raw!=="staple")return raw;
  for(const k in TYPEMAP)if(raw.includes(k))return TYPEMAP[k];
  const meal=String(o.meal||"").toLowerCase();if(meal==="breakfast")return "bf";
  const txt=(String(o.name||"")+" "+JSON.stringify(o.ing||o.ingredients||"")).toLowerCase();
  if(/chingri|prawn|fish|maach|mach|ilish|rui|katla|bhetki|pabda|pomfret/.test(txt))return "fish";
  if(/chicken|murgi/.test(txt))return "chicken";
  if(/mutton|pathar|keema/.test(txt))return "mutton";
  if(/\begg|dim\b|dimer/.test(txt))return "egg";
  if(/dal\b|daal/.test(txt))return "dal";
  return o.veg===false?"fish":"side";
}
let WHEREMAP=null;
function guessWhere(n){
  if(!WHEREMAP){WHEREMAP={};BUILTIN.forEach(d=>d.ing.forEach(x=>{WHEREMAP[ingKey(x.n)]=x.c;}));}
  const k=ingKey(n);if(WHEREMAP[k])return WHEREMAP[k];
  for(const key in WHEREMAP)if(key.length>3&&(k.includes(key)||key.includes(k)))return WHEREMAP[key];
  if(/fish|prawn|chingri|chicken|mutton|maach|keema/i.test(n))return "F";
  if(/\begg/i.test(n))return "E";
  if(/dal|rice|flour|atta|oil|sauce|powder|seeds|masala|paneer|curd|milk|noodle|besan|suji|poha|chire/i.test(n))return "G";
  return "V";
}
function normIng(list){
  return (Array.isArray(list)?list:[]).map(x=>{
    if(typeof x==="string")return {n:x.slice(0,40),q:0,u:"g",c:"G"};
    if(!x)return null;
    const n=String(x.n||x.name||x.item||"").slice(0,40);if(!n)return null;
    let q=x.q!=null?x.q:x.qty!=null?x.qty:x.quantity;let u=x.u||x.unit||"";
    if(typeof q==="string"){const m=q.match(/([\d.]+)\s*([a-z]*)/i);if(m){q=+m[1];if(!u)u=m[2];}else q=0;}
    u=String(u).toLowerCase();u=/^(g|gm|gram|grams)$/.test(u)?"g":/^(kg)$/.test(u)?(q=(+q||0)*1000,"g"):/^(ml)$/.test(u)?"ml":/^(l|litre|liter)$/.test(u)?(q=(+q||0)*1000,"ml"):/bunch/.test(u)?"bunch":/pack/.test(u)?"pack":/^(pc|pcs|piece|pieces|no|nos|)$/.test(u)?"pc":"g";
    const c=String(x.c||x.where||"").toUpperCase();
    return {n,q:+q||0,u,c:WHERE[c]?c:guessWhere(n)};
  }).filter(Boolean).slice(0,10);
}
function findDishes(text){
  text=String(text||"");const tries=[];
  const tag=text.match(/<dishes>([\s\S]*?)<\/dishes>/i);if(tag)tries.push(tag[1]);
  const fence=text.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence)tries.push(fence[1]);
  for(const t of tries){try{const v=JSON.parse(t.trim());if(Array.isArray(v))return v;}catch(e){}}
  const end=text.lastIndexOf("]");if(end<0)return [];
  for(let i=text.lastIndexOf("[",end);i>=0;i=text.lastIndexOf("[",i-1)){
    try{const v=JSON.parse(text.slice(i,end+1));if(Array.isArray(v)&&v.length&&v[0]&&v[0].name)return v;}catch(e){}
    if(i===0)break;
  }
  return [];
}
function addIdeas(out,forceMeal){
  const ids=[];
  (Array.isArray(out)?out:[]).forEach((o,n)=>{
    if(!o||typeof o.name!=="string"||!o.name.trim())return;
    o.type=normType(o);
    if(typeof o.veg!=="boolean")o.veg=!["fish","chicken","egg","mutton"].includes(o.type);
    const old=allDishes().find(d=>d.name.toLowerCase()===o.name.toLowerCase());
    if(old){ids.push(old.id);return;}
    const ing=normIng(o.ing||o.ingredients);
    const mm=forceMeal||{breakfast:"b",lunch:"l",dinner:"d"}[String(o.meal||"").toLowerCase()]||"";
    const d={id:"u"+Date.now().toString(36)+n,name:o.name.trim().slice(0,60),type:o.type,veg:!!o.veg,ing,note:String(o.note||o.instructions||o.tip||"").slice(0,300),mine:true,ai:true};
    if(mm)d.meal=mm;if(o.type==="bf")d.meal="b";
    S.mine.push(d);ids.push(d.id);
  });
  return ids;
}
/* Ask Claude. opts: {meal:"any"|"breakfast"|"lunch"|"dinner", veg:"both"|"veg"|"non", count, wish} */
async function askClaude(opts){
  const forceMeal={breakfast:"b",lunch:"l",dinner:"d"}[opts.meal]||"";
  const have=allDishes().map(d=>d.name);
  if(aiReady()){
    let r,j;
    try{
      r=await fetch(AI.url.replace(/\/+$/,""),{method:"POST",headers:{"Content-Type":"application/json","x-rannaghar-token":AI.token},
        body:JSON.stringify({have,search:!!AI.web,meal:opts.meal,veg:opts.veg,count:opts.count,wish:[opts.wish,opts.meal!=="any"?"All for "+opts.meal+".":"",opts.veg==="veg"?"Vegetarian only.":opts.veg==="non"?"Non-vegetarian only.":"Half veg, half non-veg.","For each dish add a field meal: breakfast, lunch or dinner."].filter(Boolean).join(" ")})});
    }catch(e){return {error:"Could not reach your Worker. Check the Worker link in the Settings tab, and that you are online."};}
    j=await r.json().catch(()=>({}));
    if(r.status===401)return {error:"The passcode in Settings does not match APP_TOKEN on your Worker."};
    if(!r.ok)return {error:(j.error||"The Worker answered with error "+r.status)+"."};
    if(j.usd){const k=monthKey();AI.spend[k]=(AI.spend[k]||0)+j.usd;}
    const entry={t:Date.now(),what:opts.label||"Claude ideas",usd:j.usd||0,tin:j.tin||0,tout:j.tout||0,s:j.searches||0,n:0};
    AI.log=(AI.log||[]);AI.log.unshift(entry);AI.log=AI.log.slice(0,200);saveAI();
    let list=Array.isArray(j.dishes)?j.dishes.filter(o=>o&&o.name):[];
    if(!list.length)list=findDishes(j.text);
    if(!list.length&&j.text)list=salvage(j.text);
    const ids=addIdeas(list,forceMeal);
    entry.n=ids.length;saveAI();
    if(!ids.length){
      const why=j.stop==="max_tokens"?" Claude's answer was cut off.":list.length?" Claude sent "+list.length+" items in an unexpected shape.":"";
      return {error:"Claude answered but no dishes could be read."+why+(j.version>=4?"":" Your Worker is an old version: update it from GitHub.")+(j.text?" Claude said: "+String(j.text).replace(/\s+/g," ").slice(0,200):"")+" Please try once more.",usd:j.usd};
    }
    save();return {ids,usd:j.usd||0,searched:j.searched,old:!(j.version>=3)};
  }
  if(sampleFn){
    const prompt="Suggest "+opts.count+" home-style low-oil dishes for a Bengali family in Kolkata, not in this list: "+have.join("; ")+". "+(opts.wish||"")+
      (opts.meal!=="any"?" All for "+opts.meal+".":" Spread across breakfast, lunch and dinner.")+(opts.veg==="veg"?" Vegetarian only.":opts.veg==="non"?" Non-vegetarian only.":" Half veg, half non-veg.")+
      " Return ONLY a JSON array of {name, meal:breakfast|lunch|dinner, type: bf|dal|side|fish|chicken|egg|mutton|vegmain|cncarb|cnmain, veg:boolean, ing:[{n,q (for 4 people),u:g|ml|pc|bunch|pack,c:F|E|V|G|P}], note}.";
    try{let out=await sampleFn.json(prompt);if(out&&!Array.isArray(out)&&Array.isArray(out.dishes))out=out.dishes;const ids=addIdeas(out,forceMeal);if(!ids.length)return {error:"No usable ideas came back. Try again."};save();return {ids,usd:0};}
    catch(e){return {error:"Could not get ideas just now. Try again in a minute."};}
  }
  return {error:"Claude is not connected. Open the Settings tab, paste your Worker link and passcode, and tap Save connection."};
}

    $("swapList").innerHTML=allDishes().filter(x=>x.type!=="staple"&&(x.name.toLowerCase().includes(q)||TYPES[x.type].toLowerCase().includes(q)||x.ing.some(y=>y.n.toLowerCase().includes(q)))).slice(0,40).map(twoBtnRow).join("")||'<p class="hint">No dish matches. Try Ask Claude, or add your own in the Dishes tab.</p>';}
});

load();
(function(){const t=iso(new Date());for(let i=0;i<7;i++)if(iso(dateOf(i))===t)cookDay=i;})();
render();
initRemote();
if(location.protocol==="https:"&&"serviceWorker" in navigator&&!window.claude){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
